<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Atteinte des objectifs départementaux</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#1f2937}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
#title{font-size:15px;font-weight:700;margin-bottom:4px;text-align:center}
#subtitle{font-size:12px;color:#6b7280;margin-bottom:8px;text-align:center}
#wrap{position:relative;width:min(250px,70vw);aspect-ratio:1/1}
svg{width:100%;height:100%;display:block}
#center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#pct{font-size:34px;font-weight:700;line-height:1}
#label{font-size:12px;color:#6b7280;margin-top:5px;text-align:center}
#counts{margin-top:10px;font-size:12px;color:#4b5563;text-align:center;line-height:1.45}
#empty{display:none;font-size:13px;color:#6b7280;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:11px}.item{display:flex;align-items:center;gap:5px}.sw{width:10px;height:10px;border-radius:50%}.ok{background:#2e7d32}.ko{background:#e5e7eb}
</style>
</head>
<body>
<div id="app">
  <div id="title">Départements ayant atteint l’objectif annuel</div>
  <div id="subtitle">En attente des données Grist…</div>
  <div id="wrap">
    <svg viewBox="0 0 120 120" aria-label="Graphique en anneau">
      <circle cx="60" cy="60" r="48" fill="none" stroke="#e5e7eb" stroke-width="18"/>
      <circle id="arc" cx="60" cy="60" r="48" fill="none" stroke="#2e7d32" stroke-width="18" stroke-linecap="butt" transform="rotate(-90 60 60)"/>
    </svg>
    <div id="center"><div id="pct">0%</div><div id="label">objectif atteint</div></div>
  </div>
  <div class="legend"><div class="item"><span class="sw ok"></span>Objectif atteint</div><div class="item"><span class="sw ko"></span>Objectif non atteint</div></div>
  <div id="counts"></div>
  <div id="empty">Aucune donnée pour l’année sélectionnée.</div>
</div>
<script>
"use strict";
const R=48,C=2*Math.PI*R;
const arc=document.getElementById('arc');
arc.style.strokeDasharray=`${C} ${C}`;
function refValue(v){if(v&&typeof v==='object'&&v.rowId!==undefined)return v.rowId;return v}
function getYear(r){const a=refValue(r.Annee);if(a!==null&&a!==undefined&&a!=='')return String(a);return ''}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function render(records){
  const rows=(Array.isArray(records)?records:[]).filter(r=>!('Annee_selectionnee' in r)||r.Annee_selectionnee===true||r.Annee_selectionnee===1);
  if(!rows.length){document.getElementById('wrap').style.display='none';document.querySelector('.legend').style.display='none';document.getElementById('counts').style.display='none';document.getElementById('empty').style.display='block';document.getElementById('subtitle').textContent='';return}
  const r=rows[0];
  const total=Math.max(0,n(r.Nb_Departements));
  const atteints=Math.min(total,Math.max(0,n(r.Nb_Departements_Objectif_Atteint)));
  const non=Math.max(0,total-atteints);
  const pct=total?100*atteints/total:0;
  const pctAff=Math.round(pct);
  arc.style.strokeDashoffset=String(C*(1-pct/100));
  document.getElementById('pct').textContent=`${pctAff}%`;
  document.getElementById('counts').innerHTML=`${atteints} département(s) sur ${total}<br>${non} n’ayant pas encore atteint l’objectif`;
  const y=getYear(r);document.getElementById('subtitle').textContent=y?`Année ${y}`:'';
  document.getElementById('wrap').style.display='block';document.querySelector('.legend').style.display='flex';document.getElementById('counts').style.display='block';document.getElementById('empty').style.display='none';
}
grist.ready({requiredAccess:'read table'});
grist.onRecords(records=>{try{render(records)}catch(e){console.error(e);document.getElementById('empty').style.display='block';document.getElementById('empty').textContent='Erreur de lecture des données Grist : '+String(e)}});
</script>
</body>
</html>
