<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carte départementale SYNAPSE</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
html,body{margin:0;height:100%;width:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#1f2937;background:#f8fafc}#app{display:grid;grid-template-rows:auto 1fr;height:100%;width:100%}#header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb;z-index:1000}#title{font-size:16px;font-weight:700}#subtitle,#status{font-size:12px;color:#6b7280}#subtitle{margin-top:2px}#status{white-space:nowrap}#mapWrap{position:relative;min-height:0}#map{height:100%;width:100%;background:#eef2f7}.leaflet-container{font:12px/1.4 Arial,Helvetica,sans-serif}.tooltip-title{font-weight:700;margin-bottom:5px}.legend{background:rgba(255,255,255,.96);padding:9px 10px;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.22);line-height:1.35;max-width:245px}.legend-title{font-weight:700;margin-bottom:6px}.legend-row{display:flex;align-items:center;gap:7px;margin:3px 0}.legend-swatch{width:14px;height:14px;border:1px solid rgba(0,0,0,.25);flex:0 0 14px}#overseas{position:absolute;left:10px;bottom:10px;z-index:900;display:flex;gap:5px;align-items:flex-end;pointer-events:none;overflow:visible}.inset-card{position:relative;width:105px;height:108px;background:rgba(255,255,255,.97);border:1px solid #cbd5e1;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.18);overflow:visible;pointer-events:auto}.inset-card:hover{z-index:1500}.inset-title{height:20px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border-bottom:1px solid #e5e7eb;background:#fff;border-radius:6px 6px 0 0;text-align:center;padding:0 2px}.inset-map{height:87px;width:100%;overflow:visible!important}.inset-map.leaflet-container{overflow:visible!important;border-radius:0 0 6px 6px}.inset-map .leaflet-control-container{display:none}.inset-map .leaflet-tooltip-pane{z-index:10000}.inset-tooltip{min-width:190px;max-width:280px;white-space:normal;z-index:10001!important;box-shadow:0 2px 8px rgba(0,0,0,.25)}.data-card{display:flex;flex-direction:column}.data-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:5px;text-align:center;border-radius:0 0 6px 6px}.data-value{font-size:21px;font-weight:800;line-height:1}.data-status{margin-top:5px;font-size:8px;line-height:1.2;color:#374151}#error{display:none;position:absolute;inset:16px;z-index:2000;background:rgba(255,255,255,.97);border:1px solid #fecaca;border-radius:8px;padding:16px;color:#991b1b;overflow:auto}@media(max-width:850px){#overseas{display:grid;grid-template-columns:repeat(4,82px);gap:3px}.inset-card{width:82px;height:82px}.inset-title{height:18px;font-size:8px}.inset-map{height:63px}.data-value{font-size:17px}}
</style></head><body><div id="app"><div id="header"><div><div id="title">Carte départementale</div><div id="subtitle">En attente des données Grist…</div></div><div id="status"></div></div><div id="mapWrap"><div id="map"></div><div id="overseas"></div><div id="error"></div></div></div><script>
'use strict';
const GEOJSON_URL='https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-avec-outre-mer.geojson';
const OVERSEAS=[['971','Guadeloupe','map'],['972','Martinique','map'],['973','Guyane','map'],['974','La Réunion','map'],['975','Saint-Pierre-et-Miquelon','card'],['976','Mayotte','map'],['978','Saint-Martin','card']];
const MAP_OVERSEAS_CODES=new Set(OVERSEAS.filter(x=>x[2]==='map').map(x=>x[0]));
const COLORS={green:'#2e7d32',orange:'#ed6c02',red:'#c62828',grey:'#d1d5db',blue1:'#dbeafe',blue2:'#bfdbfe',blue3:'#93c5fd',blue4:'#60a5fa',blue5:'#2563eb',real0:'#991b1b',real1:'#c62828',real2:'#ef9a9a',real3:'#f59e0b',real4:'#a5d6a7',real5:'#66bb6a',real6:'#43a047',real7:'#2e7d32',real8:'#1b5e20',plan1:'#c8e6c9',plan2:'#81c784',plan3:'#4caf50',plan4:'#2e7d32',plan5:'#1b5e20'};
const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:4});map.attributionControl.addAttribution('Contours : IGN / INSEE – GeoJSON gregoiredavid');map.setView([46.6,2.4],5.3);
let geojsonData=null,geoLayer=null,legendControl=null,currentRecords=[],rowByCode=new Map(),insetMaps=[];
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function code(v){if(v===null||v===undefined)return'';const s=String(v).trim().toUpperCase();return /^\d$/.test(s)?'0'+s:s}
function year(r){if(!r)return'';const a=r.Annee;if(a&&typeof a==='object'&&a.rowId!==undefined)return String(a.rowId);if(a!==null&&a!==undefined)return String(a).replace(/\.0$/,'');const m=String(r.Cle_Annee_Niveau||'').match(/^(\d{4})\|/);return m?m[1]:''}
function selected(r){return !('Annee_selectionnee' in r)||r.Annee_selectionnee===true||r.Annee_selectionnee===1||r.Annee_selectionnee==='true'||r.Annee_selectionnee==='True'}
function mode(records){const s=records.map(r=>String(r.Statut||'')),has=t=>s.some(x=>x.includes(t));if(has('Objectif atteint')||has('Atteignable en prévision')||has('Objectif non atteint'))return'OBJECTIF';if(has('Objectif prévisionnel atteint')||has('Objectif prévisionnel non atteint'))return'PREVISION';if(s.some(x=>x==='Plan non mis en œuvre'||/mise\(s\) en œuvre/i.test(x)))return'PLAN';if(has('en retard')||has('Aucun exercice en retard'))return'RETARD';if(s.some(x=>/exercice\(s\) réalisé\(s\)/i.test(x)))return'REALISES';if(s.some(x=>/exercice\(s\) programmé\(s\)/i.test(x)))return'PROGRAMMES';if(s.some(x=>['Réalisé','Programmé','Non couvert','Aucun objectif fixé'].includes(x)))return'THEMATIQUE';return'GENERIC'}
function modeLabel(m){return{OBJECTIF:'Atteinte de l’objectif',PREVISION:'Atteinte prévisionnelle',REALISES:'Nombre d’exercices réalisés',PROGRAMMES:'Nombre d’exercices programmés',RETARD:'Exercices programmés en retard',THEMATIQUE:'Couverture thématique',PLAN:'Plans mis en œuvre'}[m]||'Indicateur sélectionné'}
function breaks(records){const v=records.map(r=>Number(r.Valeur)).filter(x=>Number.isFinite(x)&&x>=0),mx=v.length?Math.max(...v):0;if(mx<=0)return[0,1,2,3,4];return[0,Math.max(1,Math.ceil(mx*.25)),Math.max(1,Math.ceil(mx*.5)),Math.max(1,Math.ceil(mx*.75)),mx]}
function realisedColor(v){if(v<=0)return COLORS.real0;if(v===1)return COLORS.real1;if(v===2)return COLORS.real2;if(v===3)return COLORS.real3;if(v===4)return COLORS.real4;if(v===5)return COLORS.real5;if(v===6)return COLORS.real6;if(v===7)return COLORS.real7;return COLORS.real8}
function planColor(v){if(v<=0)return COLORS.grey;if(v===1)return COLORS.plan1;if(v===2)return COLORS.plan2;if(v===3)return COLORS.plan3;if(v===4)return COLORS.plan4;return COLORS.plan5}
function styleFor(r,m,b){const base={color:'#fff',weight:1,fillOpacity:.88};if(!r)return{...base,fillColor:COLORS.grey,fillOpacity:.5};const s=String(r.Statut||'');if(m==='OBJECTIF'){if(s==='Objectif atteint')return{...base,fillColor:COLORS.green};if(s==='Atteignable en prévision')return{...base,fillColor:COLORS.orange};if(s==='Objectif non atteint')return{...base,fillColor:COLORS.red};return{...base,fillColor:COLORS.grey}}if(m==='PREVISION'){if(s==='Objectif prévisionnel atteint')return{...base,fillColor:COLORS.green};if(s==='Objectif prévisionnel non atteint')return{...base,fillColor:COLORS.red};return{...base,fillColor:COLORS.grey}}if(m==='THEMATIQUE'){if(s==='Réalisé')return{...base,fillColor:COLORS.green};if(s==='Programmé')return{...base,fillColor:COLORS.orange};if(s==='Non couvert')return{...base,fillColor:COLORS.red};return{...base,fillColor:COLORS.grey}}if(m==='RETARD'){const v=Number(r.Valeur);return{...base,fillColor:(!Number.isFinite(v)||v===0)?COLORS.green:COLORS.red}}if(m==='REALISES'){const v=Number(r.Valeur);return{...base,fillColor:Number.isFinite(v)?realisedColor(Math.max(0,Math.round(v))):COLORS.grey}}if(m==='PLAN'){const v=Number(r.Valeur);return{...base,fillColor:Number.isFinite(v)?planColor(Math.max(0,Math.round(v))):COLORS.grey}}const v=Number(r.Valeur);if(!Number.isFinite(v)||v<=0)return{...base,fillColor:COLORS.grey};if(v<=b[1])return{...base,fillColor:COLORS.blue1};if(v<=b[2])return{...base,fillColor:COLORS.blue2};if(v<=b[3])return{...base,fillColor:COLORS.blue3};if(v<b[4])return{...base,fillColor:COLORS.blue4};return{...base,fillColor:COLORS.blue5}}
function tooltip(r,f){const n=f?.properties?.nom||f?.properties?.name||'';if(!r)return'<div class="tooltip-title">'+esc(n)+'</div>Aucune donnée pour l’année sélectionnée.';if(mode([r])==='PLAN')return'<div class="tooltip-title">'+esc(r.Departement||n)+'</div>'+esc(r.Statut||'');const raw=String(r.Infobulle||'');if(raw)return raw.split('\n').map((x,i)=>i===0?'<div class="tooltip-title">'+esc(x)+'</div>':esc(x)).join('<br>');return'<div class="tooltip-title">'+esc(r.Departement||n)+'</div>'+esc(r.Statut||'')}
function legendRows(m,b){if(m==='OBJECTIF')return[[COLORS.green,'Objectif atteint'],[COLORS.orange,'Atteignable en prévision'],[COLORS.red,'Objectif non atteint'],[COLORS.grey,'Sans objectif / sans donnée']];if(m==='PREVISION')return[[COLORS.green,'Objectif prévisionnel atteint'],[COLORS.red,'Objectif prévisionnel non atteint'],[COLORS.grey,'Sans objectif / sans donnée']];if(m==='THEMATIQUE')return[[COLORS.green,'Réalisé'],[COLORS.orange,'Programmé'],[COLORS.red,'Non couvert'],[COLORS.grey,'Aucun objectif / sans donnée']];if(m==='RETARD')return[[COLORS.green,'Aucun exercice en retard'],[COLORS.red,'Au moins un exercice en retard'],[COLORS.grey,'Sans donnée']];if(m==='REALISES')return[[COLORS.real0,'0'],[COLORS.real1,'1'],[COLORS.real2,'2'],[COLORS.real3,'3'],[COLORS.real4,'4'],[COLORS.real5,'5'],[COLORS.real6,'6'],[COLORS.real7,'7'],[COLORS.real8,'8 et +']];if(m==='PLAN')return[[COLORS.grey,'Aucune mise en œuvre'],[COLORS.plan1,'1'],[COLORS.plan2,'2'],[COLORS.plan3,'3'],[COLORS.plan4,'4'],[COLORS.plan5,'5 et +']];return[[COLORS.grey,'0'],[COLORS.blue1,'1 à '+b[1]],[COLORS.blue2,(b[1]+1)+' à '+b[2]],[COLORS.blue3,(b[2]+1)+' à '+b[3]],[COLORS.blue4,(b[3]+1)+' à '+Math.max(b[3]+1,b[4]-1)],[COLORS.blue5,b[4]+' et +']]}
function updateLegend(m,b){if(legendControl)map.removeControl(legendControl);legendControl=L.control({position:'bottomright'});legendControl.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<div class="legend-title">'+esc(modeLabel(m))+'</div>'+legendRows(m,b).map(([c,l])=>'<div class="legend-row"><span class="legend-swatch" style="background:'+c+'"></span><span>'+esc(l)+'</span></div>').join('');return d};legendControl.addTo(map)}
function addHover(layer,baseStyle){layer.on({mouseover:e=>e.target.setStyle({weight:2.2,color:'#111827',fillOpacity:.95}),mouseout:e=>e.target.setStyle(baseStyle())})}
function dataCard(c,name,m,b){const r=rowByCode.get(c),st=styleFor(r,m,b),val=r&&r.Valeur!=null?r.Valeur:'—',card=document.createElement('div');card.className='inset-card data-card';card.innerHTML='<div class="inset-title">'+esc(name)+'</div><div class="data-body" style="background:'+st.fillColor+'"><div class="data-value">'+esc(val)+'</div><div class="data-status">'+esc(r?r.Statut:'Aucune donnée')+'</div></div>';card.title=r?String(r.Infobulle||r.Statut||''):'Aucune donnée';return card}
function renderInsets(m,b){insetMaps.forEach(x=>x.remove());insetMaps=[];const host=document.getElementById('overseas');host.innerHTML='';for(const [c,name,kind] of OVERSEAS){if(kind==='card'){host.appendChild(dataCard(c,name,m,b));continue}const f=geojsonData.features.find(x=>code(x?.properties?.code)===c);if(!f){host.appendChild(dataCard(c,name,m,b));continue}const card=document.createElement('div');card.className='inset-card';card.innerHTML='<div class="inset-title">'+esc(name)+'</div><div class="inset-map" id="inset-'+c+'"></div>';host.appendChild(card);const im=L.map('inset-'+c,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false});const r=rowByCode.get(c),insetStyle=()=>styleFor(r,m,b);const layer=L.geoJSON(f,{style:insetStyle,onEachFeature:(ft,ly)=>{ly.bindTooltip(tooltip(r,ft),{sticky:true,direction:'top',offset:[0,-8],opacity:.97,className:'inset-tooltip'});addHover(ly,insetStyle)}}).addTo(im);im.fitBounds(layer.getBounds(),{padding:[8,8],maxZoom:9});insetMaps.push(im)}}
function redraw(){if(!geojsonData)return;const filtered=currentRecords.filter(selected);rowByCode=new Map();filtered.forEach(r=>{const c=code(r.Code_geo);if(c)rowByCode.set(c,r)});const m=mode(filtered),b=breaks(filtered);if(geoLayer)geoLayer.remove();const metro={type:'FeatureCollection',features:geojsonData.features.filter(f=>!MAP_OVERSEAS_CODES.has(code(f?.properties?.code)))};geoLayer=L.geoJSON(metro,{style:f=>styleFor(rowByCode.get(code(f?.properties?.code)),m,b),onEachFeature:(f,l)=>{const r=rowByCode.get(code(f?.properties?.code)),base=()=>styleFor(r,m,b);l.bindTooltip(tooltip(r,f),{sticky:true,direction:'auto',opacity:.97});addHover(l,base)}}).addTo(map);map.fitBounds([[41.1,-5.4],[51.3,9.8]],{padding:[10,10]});renderInsets(m,b);updateLegend(m,b);const y=filtered.map(year).find(Boolean)||'';document.getElementById('subtitle').textContent=modeLabel(m)+(y?' — '+y:'');document.getElementById('status').textContent=filtered.length+' département(s) reçu(s)'}
function showError(msg){const d=document.getElementById('error');d.style.display='block';d.textContent=msg}
function loadGeoJSON(){fetch(GEOJSON_URL).then(r=>{if(!r.ok)throw new Error('Chargement GeoJSON impossible');return r.json()}).then(g=>{geojsonData=g;redraw()}).catch(e=>showError('Erreur de chargement cartographique :\n\n'+String(e)))}
grist.ready({requiredAccess:'read table'});grist.onRecords(records=>{try{currentRecords=Array.isArray(records)?records:[];document.getElementById('error').style.display='none';redraw()}catch(e){console.error(e);showError('Erreur de traitement des données Grist :\n\n'+String(e))}});loadGeoJSON();
</script></body></html>
