<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carte départementale SYNAPSE</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<style>
html,body{margin:0;height:100%;width:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#1f2937;background:#f8fafc}
#app{display:grid;grid-template-rows:auto 1fr;height:100%;width:100%}
#header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb;z-index:1000}
#title{font-size:16px;font-weight:700}#subtitle,#status{font-size:12px;color:#6b7280}#subtitle{margin-top:2px}#status{white-space:nowrap}
#mapWrap{position:relative;min-height:0}#map{height:100%;width:100%;background:#eef2f7}.leaflet-container{font:12px/1.4 Arial,Helvetica,sans-serif}.tooltip-title{font-weight:700;margin-bottom:5px}
.legend{background:rgba(255,255,255,.96);padding:9px 10px;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.22);line-height:1.35;max-width:245px}.legend-title{font-weight:700;margin-bottom:6px}.legend-row{display:flex;align-items:center;gap:7px;margin:3px 0}.legend-swatch{width:14px;height:14px;border:1px solid rgba(0,0,0,.25);flex:0 0 14px}
#overseas{position:absolute;left:10px;bottom:10px;z-index:900;display:flex;gap:6px;align-items:flex-end;pointer-events:none}.inset-card{width:112px;height:112px;background:rgba(255,255,255,.97);border:1px solid #cbd5e1;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.18);overflow:hidden;pointer-events:auto}.inset-title{height:20px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border-bottom:1px solid #e5e7eb;background:#fff}.inset-map{height:91px;width:100%}.inset-map .leaflet-control-container{display:none}
#error{display:none;position:absolute;inset:16px;z-index:2000;background:rgba(255,255,255,.97);border:1px solid #fecaca;border-radius:8px;padding:16px;color:#991b1b;overflow:auto}
@media(max-width:850px){#overseas{display:grid;grid-template-columns:repeat(3,86px);gap:4px}.inset-card{width:86px;height:86px}.inset-title{height:18px;font-size:9px}.inset-map{height:67px}}
</style>
</head>
<body>
<div id="app"><div id="header"><div><div id="title">Carte départementale</div><div id="subtitle">En attente des données Grist…</div></div><div id="status"></div></div><div id="mapWrap"><div id="map"></div><div id="overseas"></div><div id="error"></div></div></div>
<script>
"use strict";
const GEOJSON_URL="https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-avec-outre-mer.geojson";
const DROM=[['971','Guadeloupe'],['972','Martinique'],['973','Guyane'],['974','La Réunion'],['976','Mayotte']];
const DROM_CODES=new Set(DROM.map(x=>x[0]));
const COLORS={green:'#2e7d32',orange:'#ed6c02',red:'#c62828',grey:'#d1d5db',blue1:'#dbeafe',blue2:'#bfdbfe',blue3:'#93c5fd',blue4:'#60a5fa',blue5:'#2563eb'};
const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:4});
map.attributionControl.addAttribution('Contours : IGN / INSEE – GeoJSON gregoiredavid');
map.setView([46.6,2.4],5.3);
let geojsonData=null,geoLayer=null,legendControl=null,currentRecords=[],rowByCode=new Map(),insetMaps=[];
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function code(v){if(v===null||v===undefined)return'';const s=String(v).trim().toUpperCase();return /^\d$/.test(s)?'0'+s:s}
function year(r){if(!r)return'';const a=r.Annee;if(a&&typeof a==='object'&&a.rowId!==undefined)return String(a.rowId);if(a!==null&&a!==undefined)return String(a);const m=String(r.Cle_Annee_Niveau||'').match(/^(\d{4})\|/);return m?m[1]:''}
function selected(r){return !('Annee_selectionnee' in r)||r.Annee_selectionnee===true||r.Annee_selectionnee===1}
function mode(records){const s=records.map(r=>String(r.Statut||'')),has=t=>s.some(x=>x.includes(t));if(has('Objectif atteint')||has('Atteignable en prévision')||has('Objectif non atteint'))return'OBJECTIF';if(has('Objectif prévisionnel atteint')||has('Objectif prévisionnel non atteint'))return'PREVISION';if(has('en retard')||has('Aucun exercice en retard'))return'RETARD';if(s.some(x=>/exercice\(s\) réalisé\(s\)/i.test(x)))return'REALISES';if(s.some(x=>/exercice\(s\) programmé\(s\)/i.test(x)))return'PROGRAMMES';if(s.some(x=>['Réalisé','Programmé','Non couvert','Aucun objectif fixé'].includes(x)))return'THEMATIQUE';return'GENERIC'}
function modeLabel(m){return {OBJECTIF:'Atteinte de l’objectif',PREVISION:'Atteinte prévisionnelle',REALISES:'Nombre d’exercices réalisés',PROGRAMMES:'Nombre d’exercices programmés',RETARD:'Exercices programmés en retard',THEMATIQUE:'Couverture thématique'}[m]||'Indicateur sélectionné'}
function breaks(records){const v=records.map(r=>Number(r.Valeur)).filter(x=>Number.isFinite(x)&&x>=0),mx=v.length?Math.max(...v):0;if(mx<=0)return[0,1,2,3,4];return[0,Math.max(1,Math.ceil(mx*.25)),Math.max(1,Math.ceil(mx*.5)),Math.max(1,Math.ceil(mx*.75)),mx]}
function styleFor(r,m,b){const base={color:'#fff',weight:1,fillOpacity:.88};if(!r)return{...base,fillColor:COLORS.grey,fillOpacity:.5};const s=String(r.Statut||'');if(m==='OBJECTIF'){if(s==='Objectif atteint')return{...base,fillColor:COLORS.green};if(s==='Atteignable en prévision')return{...base,fillColor:COLORS.orange};if(s==='Objectif non atteint')return{...base,fillColor:COLORS.red};return{...base,fillColor:COLORS.grey}}if(m==='PREVISION'){if(s==='Objectif prévisionnel atteint')return{...base,fillColor:COLORS.green};if(s==='Objectif prévisionnel non atteint')return{...base,fillColor:COLORS.red};return{...base,fillColor:COLORS.grey}}if(m==='THEMATIQUE'){if(s==='Réalisé')return{...base,fillColor:COLORS.green};if(s==='Programmé')return{...base,fillColor:COLORS.orange};if(s==='Non couvert')return{...base,fillColor:COLORS.red};return{...base,fillColor:COLORS.grey}}if(m==='RETARD'){const v=Number(r.Valeur);return{...base,fillColor:(!Number.isFinite(v)||v===0)?COLORS.green:COLORS.red}}const v=Number(r.Valeur);if(!Number.isFinite(v)||v<=0)return{...base,fillColor:COLORS.grey};if(v<=b[1])return{...base,fillColor:COLORS.blue1};if(v<=b[2])return{...base,fillColor:COLORS.blue2};if(v<=b[3])return{...base,fillColor:COLORS.blue3};if(v<b[4])return{...base,fillColor:COLORS.blue4};return{...base,fillColor:COLORS.blue5}}
function tooltip(r,f){const n=f?.properties?.nom||f?.properties?.name||'';if(!r)return`<div class="tooltip-title">${esc(n)}</div>Aucune donnée pour l’année sélectionnée.`;const raw=String(r.Infobulle||'');if(raw)return raw.split('\n').map((x,i)=>i===0?`<div class="tooltip-title">${esc(x)}</div>`:esc(x)).join('<br>');return`<div class="tooltip-title">${esc(r.Departement||n)}</div>${esc(r.Statut||'')}`}
function legendRows(m,b){if(m==='OBJECTIF')return[[COLORS.green,'Objectif atteint'],[COLORS.orange,'Atteignable en prévision'],[COLORS.red,'Objectif non atteint'],[COLORS.grey,'Sans objectif / sans donnée']];if(m==='PREVISION')return[[COLORS.green,'Objectif prévisionnel atteint'],[COLORS.red,'Objectif prévisionnel non atteint'],[COLORS.grey,'Sans objectif / sans donnée']];if(m==='THEMATIQUE')return[[COLORS.green,'Réalisé'],[COLORS.orange,'Programmé'],[COLORS.red,'Non couvert'],[COLORS.grey,'Aucun objectif / sans donnée']];if(m==='RETARD')return[[COLORS.green,'Aucun exercice en retard'],[COLORS.red,'Au moins un exercice en retard'],[COLORS.grey,'Sans donnée']];return[[COLORS.grey,'0'],[COLORS.blue1,`1 à ${b[1]}`],[COLORS.blue2,`${b[1]+1} à ${b[2]}`],[COLORS.blue3,`${b[2]+1} à ${b[3]}`],[COLORS.blue4,`${b[3]+1} à ${Math.max(b[3]+1,b[4]-1)}`],[COLORS.blue5,`${b[4]} et +`]]}
function updateLegend(m,b){if(legendControl)map.removeControl(legendControl);legendControl=L.control({position:'bottomright'});legendControl.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML=`<div class="legend-title">${esc(modeLabel(m))}</div>`+legendRows(m,b).map(([c,l])=>`<div class="legend-row"><span class="legend-swatch" style="background:${c}"></span><span>${esc(l)}</span></div>`).join('');return d};legendControl.addTo(map)}
function addHover(){/* effet graphique désactivé : l'infobulle reste active */}
function renderInsets(m,b){insetMaps.forEach(x=>x.remove());insetMaps=[];const host=document.getElementById('overseas');host.innerHTML='';for(const [c,name] of DROM){const f=geojsonData.features.find(x=>code(x?.properties?.code)===c);if(!f)continue;const card=document.createElement('div');card.className='inset-card';card.innerHTML=`<div class="inset-title">${esc(name)}</div><div class="inset-map" id="inset-${c}"></div>`;host.appendChild(card);const im=L.map(`inset-${c}`,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false});const r=rowByCode.get(c);const insetStyle=()=>styleFor(r,m,b);const layer=L.geoJSON(f,{style:insetStyle,onEachFeature:(ft,ly)=>{ly.bindTooltip(tooltip(r,ft),{sticky:true,direction:'auto',opacity:.97})}}).addTo(im);im.fitBounds(layer.getBounds(),{padding:[8,8],maxZoom:9});insetMaps.push(im)}}
function redraw(){if(!geojsonData)return;const filtered=currentRecords.filter(selected);rowByCode=new Map(filtered.filter(r=>code(r.Code_geo)).map(r=>[code(r.Code_geo),r]));const m=mode(filtered),b=breaks(filtered);if(geoLayer)geoLayer.remove();const metro={type:'FeatureCollection',features:geojsonData.features.filter(f=>!DROM_CODES.has(code(f?.properties?.code)))};geoLayer=L.geoJSON(metro,{style:f=>styleFor(rowByCode.get(code(f?.properties?.code)),m,b),onEachFeature:(f,l)=>{const r=rowByCode.get(code(f?.properties?.code));l.bindTooltip(tooltip(r,f),{sticky:true,direction:'auto',opacity:.97});addHover(l,geoLayer)}}).addTo(map);map.fitBounds([[41.1,-5.4],[51.3,9.8]],{padding:[10,10]});renderInsets(m,b);updateLegend(m,b);const y=filtered.length?year(filtered[0]):'';document.getElementById('subtitle').textContent=`${modeLabel(m)}${y?' — '+y:''}`;document.getElementById('status').textContent=`${filtered.length} département(s) reçu(s)`}
async function loadGeoJSON(){try{const r=await fetch(GEOJSON_URL,{cache:'force-cache'});if(!r.ok)throw new Error(`GeoJSON : HTTP ${r.status}`);geojsonData=await r.json();redraw()}catch(e){showError('Impossible de charger le fond GeoJSON des départements.\n\n'+String(e)+'\n\nVérifier l’accès réseau à raw.githubusercontent.com.')}}
function showError(msg){const b=document.getElementById('error');b.style.display='block';b.textContent=msg}
grist.ready({requiredAccess:'read table'});grist.onRecords(records=>{try{currentRecords=Array.isArray(records)?records:[];redraw()}catch(e){console.error(e);showError('Erreur de traitement des données Grist :\n\n'+String(e))}});loadGeoJSON();
</script>
</body>
</html>
