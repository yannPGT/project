<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Atteinte des objectifs EMIZ</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#1f2937}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;box-sizing:border-box}
#title{font-size:15px;font-weight:700;margin-bottom:4px;text-align:center}
#subtitle{font-size:12px;color:#6b7280;margin-bottom:8px;text-align:center}
#wrap{position:relative;width:min(250px,70vw);aspect-ratio:1/1}
svg{width:100%;height:100%;display:block}
#center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#pct{font-size:34px;font-weight:700;line-height:1}
#label{font-size:12px;color:#6b7280;margin-top:5px;text-align:center}
#counts{margin-top:10px;font-size:12px;color:#4b5563;text-align:center;line-height:1.45}
#empty{display:none;font-size:13px;color:#6b7280;text-align:center}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:11px}.item{display:flex;align-items:center;gap:5px}.sw{width:10px;height:10px;border-radius:50%}.ok{background:#2e7d32}.ko{background:#e5e7eb}
</style>
</head>
<body>
<div id="app">
  <div id="title">EMIZ ayant atteint l’objectif annuel</div>
  <div id="subtitle">En attente des données Grist…</div>
  <div id="wrap">
    <svg viewBox="0 0 120 120" aria-label="Graphique en anneau">
      <circle cx="60" cy="60" r="48" fill="none" stroke="#e5e7eb" stroke-width="18"/>
      <circle id="arc" cx="60" cy="60" r="48" fill="none" stroke="#2e7d32" stroke-width="18" stroke-linecap="butt" transform="rotate(-90 60 60)"/>
    </svg>
    <div id="center"><div id="pct">0%</div><div id="label">objectif atteint</div></div>
  </div>
  <div class="legend"><div class="item"><span class="sw ok"></span>Objectif atteint</div><div class="item"><span class="sw ko"></span>Objectif non atteint</div></div>
  <div id="counts"></div>
  <div id="empty">Aucune donnée pour l’année sélectionnée.</div>
</div>
<script>
"use strict";
const TABLE='STATISTIQUES_GENERALE_EMIZ';
const R=48,C=2*Math.PI*R;
const arc=document.getElementById('arc');
arc.style.strokeDasharray=`${C} ${C}`;
let lastSignature='';
function rows(t){const out=[];if(!t||!Array.isArray(t.id))return out;for(let i=0;i<t.id.length;i++){const r={id:t.id[i]};for(const k of Object.keys(t)){if(k!=='id'&&Array.isArray(t[k]))r[k]=t[k][i];}out.push(r);}return out;}
function selected(r){return r&&('Annee_selectionnee' in r)&&(r.Annee_selectionnee===true||r.Annee_selectionnee===1)}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function getYear(r){
  const a=r?.Annee;
  if(a&&typeof a==='object'){
    if(a.Annee!==undefined&&/20\d{2}/.test(String(a.Annee)))return String(a.Annee).match(/20\d{2}/)[0];
    if(a.displayValue!==undefined&&/20\d{2}/.test(String(a.displayValue)))return String(a.displayValue).match(/20\d{2}/)[0];
  }
  if(Array.isArray(a))for(const v of a){const m=String(v??'').match(/20\d{2}/);if(m)return m[0];}
  const dm=String(a??'').match(/20\d{2}/);if(dm)return dm[0];
  for(const k of Object.keys(r||{})){const m=String(r[k]??'').match(/^(20\d{2})\|/);if(m)return m[1];}
  return '';
}
function render(records){
  const r=(records||[]).find(selected)||null;
  if(!r){document.getElementById('wrap').style.display='none';document.querySelector('.legend').style.display='none';document.getElementById('counts').style.display='none';document.getElementById('empty').style.display='block';document.getElementById('subtitle').textContent='';return;}
  const total=Math.max(0,n(r.Nb_EMIZ));
  const atteints=Math.min(total,Math.max(0,n(r.Nb_EMIZ_Objectif_Atteint)));
  const non=Math.max(0,total-atteints);
  const pct=total?100*atteints/total:0;
  const pctAff=Math.round(pct);
  arc.style.strokeDashoffset=String(C*(1-pct/100));
  document.getElementById('pct').textContent=`${pctAff}%`;
  document.getElementById('counts').innerHTML=`${atteints} EMIZ sur ${total}<br>${non} n’ayant pas encore atteint l’objectif`;
  const y=getYear(r);document.getElementById('subtitle').textContent=y?`Année ${y}`:'';
  document.getElementById('wrap').style.display='block';document.querySelector('.legend').style.display='flex';document.getElementById('counts').style.display='block';document.getElementById('empty').style.display='none';
}
function signature(records){const r=(records||[]).find(selected);if(!r)return'none';return[getYear(r),r.Nb_EMIZ,r.Nb_EMIZ_Objectif_Atteint,r.Pct_EMIZ_Objectif_Atteint].join('|');}
async function refresh(){try{const t=await grist.docApi.fetchTable(TABLE);const data=rows(t);const sig=signature(data);if(sig!==lastSignature){lastSignature=sig;render(data)}}catch(e){console.error(e);document.getElementById('empty').style.display='block';document.getElementById('empty').textContent='Erreur de lecture des données Grist : '+String(e)}}
grist.ready({requiredAccess:'full'});
grist.onRecords(records=>{try{render(records||[])}catch(e){console.error(e)}},{expandRefs:true});
setTimeout(refresh,300);setInterval(refresh,1000);
</script>
</body>
</html>
