<script>
(function(root){
 'use strict';
 const active=p=>p.Actif===true||p.Actif===1||p.Actif==='true';
 const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 function emails(value){return String(value||'').split(/[;,\n]+/).map(s=>s.trim()).filter(Boolean);}
 const valid=s=>/^[^\s@<>;,]+@[^\s@<>;,]+\.[^\s@<>;,]+$/.test(s)&&!/[\r\n]/.test(s);
 function addresses(value){return emails(value).filter(valid);}
 function unique(values){return [...new Map(values.map(s=>[s.toLowerCase(),s])).values()];}
 function rows(table){return (table.id||[]).map((id,i)=>Object.fromEntries(Object.keys(table).map(k=>[k,table[k][i]])));}
 function coverage(data){
  const territories=data.Territoires.filter(t=>active({Actif:t.Attendu}));
  const status=territories.map(t=>{
   const entities=data.Entites.filter(e=>e.Territoire===t.id&&active(e));
   const people=data.Personnes.filter(p=>active(p)&&entities.some(e=>e.id===p.Entite));
   const generic=entities.flatMap(e=>addresses(e.Courriel));
   return {territory:t,person:people.length>0,generic:generic.length>0,email:generic.length>0||people.some(p=>addresses(p.Courriel).length>0)};
  });
  return {expected:territories.length,people:data.Personnes.filter(active).length,generic:unique(data.Entites.filter(active).flatMap(e=>addresses(e.Courriel))).length,status,person:status.filter(s=>s.person).length,email:status.filter(s=>s.email).length};
 }
 function recipients(data,entityIds,personIds){
  const found=[],missing=[],invalid=[];
  for(const [items,ids] of [[data.Entites,entityIds],[data.Personnes.filter(active),personIds]]){
   for(const r of items.filter(r=>ids.includes(r.id))){
    const label=r.Nom||r.Libelle||String(r.id),values=emails(r.Courriel);
    if(!values.length)missing.push(label);
    for(const a of values){if(valid(a))found.push(a);else invalid.push(label+' : '+a);}
   }
  }
  return {addresses:unique(found),missing,invalid};
 }
 function mailto(list,subject,body){if(!list.length||list.some(a=>!valid(a)))throw Error('Destinataires invalides');return 'mailto:'+list.map(encodeURIComponent).join(',')+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);}
 function stale(value,days,now=Date.now()){const parsed=Date.parse(value);return !Number.isFinite(parsed)||(now-parsed)>days*86400000;}
 function changes(before,after){return Object.fromEntries(Object.keys(after).filter(k=>before[k]!==after[k]).map(k=>[k,{avant:before[k]??null,apres:after[k]}]));}
 function singleTerritory(data,zid){const ts=data.Territoires.filter(t=>t.Zone===zid&&t.Type!=='Particulier'&&active({Actif:t.Attendu}));return ts.length===1?ts[0]:null;}
 function profile(data,p){if(p.level==='zonal'){const t=singleTerritory(data,p.zone);if(t)return {...p,level:'department',territory:t.id,collapsedZone:p.zone};}return p;}
 function scope(data,input){
  const p=profile(data,input);if(p.level==='national')return data;
  const territories=data.Territoires.filter(t=>p.level==='department'?t.id===p.territory:t.Zone===p.zone&&t.Type!=='Particulier');
  const singleton=p.level==='department'?data.Zones.filter(z=>singleTerritory(data,z.id)?.id===p.territory).map(z=>z.id):[];
  const entities=data.Entites.filter(e=>territories.some(t=>t.id===e.Territoire)||(e.Type==='Zonal'&&(p.level==='zonal'?e.Zone===p.zone:singleton.includes(e.Zone))));
  const people=data.Personnes.filter(r=>entities.some(e=>e.id===r.Entite));
  const demands=data.Demandes.filter(r=>entities.some(e=>e.id===r.Entite));
  const history=data.Historique.filter(h=>h.TableCible==='Entites'?entities.some(e=>e.id===h.Ligne):h.TableCible==='Personnes'?people.some(r=>r.id===h.Ligne):h.TableCible==='Demandes'?demands.some(r=>r.id===h.Ligne):false);
  return {...data,Territoires:territories,Zones:data.Zones.filter(z=>territories.some(t=>t.Zone===z.id)||z.id===p.zone||singleton.includes(z.id)),Entites:entities,Personnes:people,Demandes:demands,Historique:history};
 }
 function territoryEntities(data,t){const singleton=t.Zone&&singleTerritory(data,t.Zone)?.id===t.id;return data.Entites.filter(e=>active(e)&&(e.Territoire===t.id||(singleton&&e.Type==='Zonal'&&e.Zone===t.Zone)));}
 function metrics(data,full=data){
  const ts=data.Territoires.filter(t=>active({Actif:t.Attendu})),statuses=ts.map(t=>{const es=territoryEntities(full,t).filter(e=>data.Entites.some(x=>x.id===e.id));const ps=data.Personnes.filter(p=>active(p)&&es.some(e=>e.id===p.Entite));const generic=unique(es.flatMap(e=>addresses(e.Courriel)));return {territory:t,person:ps.length>0,generic:generic.length>0,email:generic.length>0||ps.some(p=>addresses(p.Courriel).length),contact:ps.length>0||generic.length>0,people:ps.length,addresses:generic.length};});

nput=e=>{const pos=e.target.selectionStart;search=e.target.value;directory();bind();$('#search').focus();$('#search').setSelectionRange(pos,pos);};$('#zone').onchange=e=>{zone=e.target.value;directory();bind();};$('#kind').onchange=e=>{kind=e.target.value;directory();bind();};}

function detail(){if(!selected)return '<div class="empty">Aucune fiche ne correspond aux filtres.</div>';let title='',subtitle='',entities=[];if(selected.startsWith('Z:')){const z=data.Zones.find(z=>z.id===Number(selected.slice(2)));if(!z)return '';title='État-major · '+z.Nom;subtitle='Contacts zonaux distincts des départements rattachés';entities=data.Entites.filter(e=>e.Zone===z.id&&e.Type==='Zonal'&&C.active(e));}else if(selected.startsWith('E:')){entities=data.Entites.filter(e=>e.id===Number(selected.slice(2)));title=entities[0]?.Libelle;}else{const t=data.Territoires.find(t=>t.UID===selected);if(!t)return '';title=t.Code+' · '+t.Nom;subtitle=zoneName(t.Zone)+(t.Attendu?' · inclus dans la couverture':' · hors indicateurs territoriaux');entities=ents(t);}return `<div class="panel"><h2>${esc(title)}</h2><p class="muted">${esc(subtitle)}</p><button data-compose="${esc(selected)}">Préparer un courriel</button></div>${entities.map(e=>entityCard(e)).join('')||'<div class="empty">Aucun service renseigné.</div>'}${selected.startsWith('Z:')?`<div class="panel"><h3>Territoires rattachés</h3><div class="list">${data.Territoires.filter(t=>String(t.Zone)===selected.slice(2)).map(linkTerr).join('')}</div></div>`:''}`;}
function entityCard(e){return `<section class="panel entity sub"><h3>${esc(e.Libelle)}</h3>${e.ARevoir?'<p class="badge">Fiche source multiple · examen avant fusion</p>':''}<p>${esc(e.Missions||'')}</p><p>Adresse générique : ${esc(e.Courriel||'Non renseignée')}</p><p>Téléphones : ${esc([e.Telephone,e.Telephone2].filter(Boolean).join(' · ')||'Non renseignés')}</p><small>Confirmation : ${esc(e.ConfirmeLe||'À effectuer')} · ${people(e).length} personne(s) active(s)</small><div class="actions"><button class="secondary" data-copy="${esc(e.Courriel)}">Copier</button><button class="secondary" data-edit="Entites:${e.id}">Modifier le service</button><button class="secondary" data-confirm="${e.id}">Confirmer les coordonnées</button><button class="secondary" data-add="${e.id}">Ajouter une personne</button></div><div class="cards sub">${people(e).map(p=>`<article class="card"><h3>${esc(p.Prenom+' '+p.Nom)}</h3><p>${esc(p.Fonction||'Fonction à renseigner')}</p><p>${esc(p.Courriel||'Courriel à renseigner')}</p><p>${esc(p.Telephone||'Téléphone à renseigner')}</p><div class="actions"><button data-person-mail="${p.id}" class="secondary">Écrire</button><button data-copy="${esc(p.Courriel)}" class="secondary">Copier</button><button data-edit="Personnes:${p.id}" class="secondary">Modifier</button>${/^[+\d ()\.\-]+$/.test(p.Telephone||'')?`<a class="action" href="tel:${esc(p.Telephone.replace(/[^+\d]/g,''))}">Appeler</a>`:''}</div></article>`).join('')||'<p class="muted">Aucune personne active renseignée.</p>'}</div></section>`;}

function updates(){$('#view').innerHTML=`<h2>Actualisation</h2><div class="notice">Les corrections sont immédiates après écriture réussie. Le journal du widget mentionne un auteur déclaré ; l’historique GRIST constitue la trace de référence du compte authentifié.</div><div class="columns"><section class="panel"><h3>Préparer une vérification</h3><label>Service<select id="verify-entity">${data.Entites.filter(C.active).map(e=>`<option value="${e.id}">${esc(e.Libelle)}</option>`).join('')}</select></label><button id="verify">Préparer la demande</button><p class="muted">Préparation, ouverture du logiciel et envoi réel restent distincts. Le retour est enregistré manuellement.</p></section><section class="panel"><h3>Paramètres BPAC</h3><label>Fréquence de vérification (jours)<input id="frequency" type="number" min="1" max="3650" value="${days()}"></label><label>URL du widget dans le document GRIST<input id="baseurl" type="url" placeholder="https://grist…/document/p/page" value="${esc(data.Parametres.find(r=>r.Cle==='UrlFiche')?.Valeur||'')}"></label><button id="settings">Enregistrer les paramètres</button></section></div><section class="panel sub"><h3>Suivi des demandes</h3>${requestTable(data.Demandes)}</section><section class="panel sub"><h3>Historique des actions du widget</h3><div class="history">${[...data.Historique].reverse().map(h=>`<details><summary>${esc(h.Date)} · ${esc(h.AuteurDeclare)} · ${esc(h.Action)} · ${esc(h.TableCible)} #${h.Ligne}</summary><pre>${esc(h.Changements)}</pre></details>`).join('')||'<p class="muted">Aucune modification enregistrée.</p>'}</div></section>`;$('#verify').onclick=()=>verify(Number($('#verify-entity').value));$('#settings').onclick=async()=>{const n=Number($('#frequency').value),url=$('#baseurl').value.trim();if(!Number.isInteger(n)||n<1||n>3650)return say('La fréquence doit être comprise entre 1 et 3650 jours.');if(url&&!/^https:\/\//.test(url))return say('Le lien doit commencer par https://.');const actions=[['FrequenceJours',String(n)],['UrlFiche',url]].map(([k,v])=>{const p=data.Parametres.find(r=>r.Cle===k);return ['UpdateRecord','Parametres',p.id,{Valeur:v}];});await write(actions,'Paramètres enregistrés.');};}
function bind(){document.querySelectorAll('[data-territory]').forEach(b=>b.onclick=()=>navigate(b.dataset.territory));document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>{selected='Z:'+b.dataset.zone;tab='directory';search='';zone='';kind='';render();});document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;render();});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(C.unique(C.addresses(b.dataset.copy)).join('; ')));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const [t,id]=b.dataset.edit.split(':');edit(t,Number(id));});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>edit('Personnes',null,Number(b.dataset.add)));document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>confirmEntity(Number(b.dataset.confirm)));document.querySelectorAll('[data-compose]').forEach(b=>b.onclick=()=>compose(b.dataset.compose));document.querySelectorAll('[data-person-mail]').forEach(b=>b.onclick=()=>compose('P:'+b.dataset.personMail));document.querySelectorAll('[data-resolve]').forEach(b=>b.onclick=()=>resolveDemand(Number(b.dataset.resolve)));}
async function copy(s){if(!s)return say('Aucune adresse utilisable à copier.');try{await navigator.clipboard.writeText(s);say('Adresses copiées.');}catch(e){openDialog('Copier les adresses',`<p>Copie automatique indisponible : sélectionnez ce texte et utilisez Ctrl+C.</p><textarea readonly rows="6">${esc(s)}</textarea>`);}}
function edit(table,id,entity){const r=id?data[table].find(r=>r.id===id):{Entite:entity,Actif:true};formBefore=structuredClone(r);const fields=table==='Personnes'?['Prenom','Nom','Fonction','Courriel','Telephone']:['Libelle','Missions','Courriel','Telephone','Telephone2'];openDialog(id?'Modifier les coordonnées':'Ajouter une personne',`<form id="editform"><div class="twocol">${fields.map(k=>`<label>${({Prenom:'Prénom',Nom:'Nom',Fonction:'Fonction',Courriel:'Courriel(s)',Telephone:'Téléphone',Telephone2:'Second téléphone',Libelle:'Service',Missions:'Missions'})[k]}<input name="${k}" value="${esc(r[k]||'')}" ${['Nom','Libelle'].includes(k)?'required':''}></label>`).join('')}</div>${table==='Personnes'?`<label><input type="checkbox" name="Actif" ${C.active(r)?'checked':''}> Personne active (décocher pour archiver)</label>`:''}<label>Auteur déclaré de la saisie<input name="Auteur" required placeholder="Prénom NOM · BPAC"></label><p class="muted">Les rattachements et habilitations se gèrent dans GRIST sous contrôle du BPAC. La date de confirmation ne change pas lors d’une simple correction.</p><button type="submit">Enregistrer</button></form>`);$('#editform').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.target),changes={};fields.forEach(k=>changes[k]=String(fd.get(k)||'').trim());if(C.emails(changes.Courriel).some(a=>!C.valid(a)))return say('Courriel invalide : utiliser des adresses seules, séparées par des points-virgules.');if(table==='Personnes')changes.Actif=fd.has('Actif');if(!id){changes.Entite=entity;changes.UID='P:'+crypto.randomUUID();changes.Source='Saisie BPAC';}const diff=C.changes(formBefore,changes);if(!Object.keys(diff).length){$('#modal').close();return say('Aucune modification.');}const action=[id?'UpdateRecord':'AddRecord',table,id,changes];if(await write([action,history(table,id||0,'Modification',diff,fd.get('Auteur'))],'Coordonnées enregistrées.'))$('#modal').close();};}
function history(table,id,action,diff,author){return ['AddRecord','Historique',null,{UID:'H:'+crypto.randomUUID(),Date:new Date().toISOString(),AuteurDeclare:String(author||'BPAC (non précisé)'),TableCible:table,Ligne:id,Action:action,Changements:JSON.stringify(diff)}];}
function confirmEntity(id){const e=data.Entites.find(e=>e.id===id);openDialog('Confirmer les coordonnées',`<p>Vous confirmez les coordonnées du service <strong>${esc(e.Libelle)}</strong> et de ses ${people(e).length} personne(s) active(s).</p><form id="confirmform"><label>Auteur déclaré<input name="Auteur" required></label><button>Confirmer</button></form>`);$('#confirmform').onsubmit=async ev=>{ev.preventDefault();const author=new FormData(ev.target).get('Auteur'),date=new Date().toISOString(),changes={ConfirmeLe:date};const actions=[['UpdateRecord','Entites',id,changes],...data.Demandes.filter(d=>d.Entite===id&&d.Statut==='Ouverte').map(d=>['UpdateRecord','Demandes',d.id,{Statut:'Confirmee',RetourLe:date}]),history('Entites',id,'Confirmation',C.changes(e,changes),author)];if(await write(actions,'Coordonnées confirmées.'))$('#modal').close();};}
function compose(key,verification=null){let es=[],ps=[],deps=[];if(key.startsWith('Z:')){const zid=Number(key.slice(2));es=data.Entites.filter(e=>e.Zone===zid&&e.Type==='Zonal'&&C.active(e));const ts=data.Territoires.filter(t=>t.Zone===zid&&t.Type!=='Particulier');deps=data.Entites.filter(e=>ts.some(t=>t.id===e.Territoire)&&C.active(e));ps=es.flatMap(people);}else if(key.startsWith('P:')){ps=data.Personnes.filter(p=>p.id===Number(key.slice(2))&&C.active(p));}else if(key.startsWith('E:')){es=data.Entites.filter(e=>e.id===Number(key.slice(2))&&C.active(e));ps=es.flatMap(people);}else {const t=data.Territoires.find(t=>t.UID===key);es=t?ents(t):[];ps=es.flatMap(people);}openDialog(verification?'Demande de vérification':'Préparer un courriel',`<form id="mailform"><h3>Choisir les destinataires</h3><div class="actions"><button type="button" class="secondary" id="allpeople">Tous les agents actifs</button>${deps.length?'<button type="button" class="secondary" id="alldeps">Tous les services territoriaux rattachés</button>':''}</div><div class="checks">${es.map(e=>`<label><input class="dest" type="checkbox" data-entity="${e.id}" checked> Adresse générique · ${esc(e.Libelle)}</label>`).join('')}${ps.map(p=>`<label><input class="dest" type="checkbox" data-person="${p.id}" ${es.length?'':'checked'}> ${esc(p.Prenom+' '+p.Nom)} · ${esc(p.Fonction)}</label>`).join('')}${deps.length?'<h3 class="sub">Adresses génériques des territoires rattachés</h3>':''}${deps.map(e=>`<label><input class="dest" type="checkbox" data-dep="${e.id}" data-entity="${e.id}"> ${esc(e.Libelle)} · ${esc(entityTerr(e)?.Nom)}</label>`).join('')}</div><p id="destinfo"></p><div class="recipients" id="recipients"></div><label>Objet<input id="subject" value="${esc(verification?.subject||'')}" required></label><label>Message<textarea id="body" rows="6">${esc(verification?.body||'')}</textarea></label><div class="actions"><button type="submit" id="mailopen">Ouvrir le logiciel de messagerie</button><button type="button" class="secondary" id="mailcopy">Copier les destinataires</button></div><p class="muted">Thunderbird doit être associé à mailto: sur votre poste. L’ouverture et l’envoi ne peuvent pas être attestés par le widget. Copiez les destinataires si le lien est trop long.</p></form>`);let selection;const update=()=>{const checked=[...document.querySelectorAll('.dest:checked')];selection=C.recipients(data,checked.filter(b=>b.dataset.entity).map(b=>Number(b.dataset.entity)),checked.filter(b=>b.dataset.person).map(b=>Number(b.dataset.person)));$('#recipients').textContent=selection.addresses.join('; ')||'Aucun courriel utilisable';$('#destinfo').textContent=selection.addresses.length+' destinataire(s) distinct(s). '+(selection.missing.length?'Adresses manquantes : '+selection.missing.join(', ')+'. ':'')+(selection.invalid.length?'Adresses écartées : '+selection.invalid.join(', '):'');$('#mailopen').disabled=!selection.addresses.length;};document.querySelectorAll('.dest').forEach(b=>b.onchange=update);$('#allpeople').onclick=()=>{document.querySelectorAll('[data-person]').forEach(b=>b.checked=true);update();};if($('#alldeps'))$('#alldeps').onclick=()=>{document.querySelectorAll('[data-dep]').forEach(b=>b.checked=true);update();};$('#mailcopy').onclick=()=>copy(selection.addresses.join('; '));$('#mailform').onsubmit=async ev=>{ev.preventDefault();const url=C.mailto(selection.addresses,$('#subject').value,$('#body').value);if(url.length>1800)return say('Lien de messagerie long : copiez les destinataires, l’objet et le message dans Thunderbird.');if(verification){const uid='D:'+crypto.randomUUID();if(!await write([['AddRecord','Demandes',null,{UID:uid,Entite:verification.entity,CreeLe:new Date().toISOString(),Statut:'Ouverte',EtatMessage:'Ouverture demandee',RetourLe:''}]],'Demande enregistrée ; ouverture du logiciel demandée.'))return;}const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();say('Ouverture function verify(id){const e=data.Entites.find(e=>e.id===id),base=data.Parametres.find(r=>r.Cle==='UrlFiche')?.Valeur||'';if(!base||!/^https:\/\//.test(base))return say('Renseignez dans les paramètres l’URL authentifiée de la page GRIST contenant le widget.');const hash=base.includes('#')?'&':'#',url=base+hash+'contact='+encodeURIComponent(e.UID);compose('E:'+id,{entity:id,subject:'Vérification des coordonnées · '+e.Libelle,body:'Bonjour,\n\nMerci de vérifier les coordonnées professionnelles du service '+e.Libelle+' et de ses agents.\n\nOuvrir la fiche (authentification GRIST requise) : '+url+'\n\nDans la fiche : « Confirmer les coordonnées » ou « Modifier le service » / « Modifier ».\n\nPendant la phase BPAC, vous pouvez transmettre vos corrections par réponse à ce courriel ; le BPAC les saisira manuellement.\n\nCordialement,\nBPAC'});}
async function resolveDemand(id){openDialog('Enregistrer un retour reçu',`<p>Cette action clôt la demande. Elle ne confirme pas les coordonnées : appliquez les corrections dans la fiche puis utilisez « Confirmer les coordonnées » si elles ont été vérifiées.</p><form id="returnform"><label>Auteur déclaré<input name="Auteur" required></label><button>Enregistrer le retour</button></form>`);$('#returnform').onsubmit=async ev=>{ev.preventDefault();const before=data.Demandes.find(d=>d.id===id),change={Statut:'Retour recu',RetourLe:new Date().toISOString()};if(await write([['UpdateRecord','Demandes',id,change],history('Demandes',id,'Retour reçu',C.changes(before,change),new FormData(ev.target).get('Auteur'))],'Retour enregistré.'))$('#modal').close();};}
async function load(){if(!live)return;const next={};await Promise.all(arrays.map(async name=>{next[name]=C.rows(await grist.docApi.fetchTable(name));}));for(const name of arrays)if(!Array.isArray(next[name]))throw Error('Table invalide : '+name);data=next;ready=true;}
async function write(actions,success){if(busy)return false;if(live&&!ready){say('Connexion non prête. Aucune écriture effectuée.');return false;}busy=true;document.querySelectorAll('#modal button').forEach(b=>b.disabled=true);try{if(live){await grist.docApi.applyUserActions(actions);try{await load();}catch(e){say('Écriture acceptée par GRIST, mais relecture impossible. Rechargez avant de poursuivre.');ready=false;return false;}}else{for(const [op,t,id,fields] of actions){if(op==='UpdateRecord'){const r=data[t].find(r=>r.id===id);Object.assign(r,fields);}else if(op==='AddRecord')data[t].push({id:Math.max(0,...data[t].map(r=>r.id))+1,...fields});}}render();say((live?'': 'Simulation : ')+success);return true;}catch(e){say('Échec de sauvegarde : '+(e.message||e)+'. Aucune confirmation de sauvegarde.');return false;}finally{busy=false;document.querySelectorAll('#modal button').forEach(b=>b.disabled=false);}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});$('#reload').onclick=async()=>{try{if(live)await load();else data=structuredClone(DEMO);render();say('Données actualisées.');}catch(e){ready=false;say('Lecture GRIST impossible : '+e.message);}};

<script>
/* Cartes issues de GeoJSON publiés ; projection Mercator locale, aucun contour dessiné à la main. */
const MapUI=(function(){
 const regionColors=['#000091','#0063cb','#18753c','#a558a0','#b34000','#006a6f','#666',' #5b3c98','#3558a2','#8b6227'];
 function points(geometry){const out=[];const visit=x=>{if(typeof x[0]==='number')out.push(x);else x.forEach(visit);};visit(geometry.coordinates);return out;}
 function raw([lon,lat]){return [lon*Math.PI/180,-Math.log(Math.tan(Math.PI/4+Math.min(85,Math.max(-85,lat))*Math.PI/360))];}
 function projected(features,w,h,pad=12){const all=features.flatMap(f=>points(f.geometry).map(raw)),xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);const minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys),scale=Math.min((w-2*pad)/(maxx-minx||1),(h-2*pad)/(maxy-miny||1));const dx=(w-(maxx-minx)*scale)/2,dy=(h-(maxy-miny)*scale)/2;const project=p=>{const [x,y]=raw(p);return [dx+(x-minx)*scale,dy+(y-miny)*scale];};return {project,scale};}
 function path(f,project){const polys=f.geometry.type==='Polygon'?[f.geometry.coordinates]:f.geometry.coordinates;return polys.map(poly=>poly.map(ring=>ring.map((p,i)=>{const [x,y]=project(p);return (i?'L':'M')+x.toFixed(2)+','+y.toFixed(2);}).join('')+'Z').join('')).join('');}

 function block(ts,full,mode,title,w=640,h=480){

  }).join('');

  }

 }
 function maps(scoped,full,profile,mode){const ts=scoped.Territoires.filter(t=>t.Attendu&&t.Type!=='Particulier');const metro=ts.filter(t=>t.Code.length===2),overseas=ts.filter(t=>t.Code.length===3);let html='';

<script>

if(window.parent!==window){
 const sources=['https://grist.numerique.gouv.fr/grist-plugin-api.js','https://docs.getgrist.com/grist-plugin-api.js'];
 let sourceIndex=0,started=false;
 const loadGristApi=()=>{
  if(sourceIndex>=sources.length){$('#mode').textContent='Démonstration · GRIST non connecté';say('Connexion GRIST impossible. Aucune donnée réelle chargée. Vérifiez l’accès réseau puis rechargez.');return;}
  const script=document.createElement('script');script.src=sources[sourceIndex++];
  script.onload=()=>{if(started)return;if(window.grist&&typeof window.grist.ready==='function'){started=true;try{startGrist();}catch(error){$('#mode').textContent='GRIST · erreur de connexion';say('Initialisation GRIST impossible : '+(error?.message||error));}}else loadGristApi();};
  script.onerror=loadGristApi;document.head.appendChild(script);
 };
 loadGristApi();
}

</script></body></html>
