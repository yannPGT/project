<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carte EMIZ SYNAPSE</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<style>
html,body{margin:0;height:100%;width:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#1f2937;background:#f8fafc}#app{display:grid;grid-template-rows:auto 1fr;height:100%;width:100%}#header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb;z-index:1000}#title{font-size:16px;font-weight:700}#subtitle,#status{font-size:12px;color:#6b7280}#subtitle{margin-top:2px}#status{white-space:nowrap}#mapWrap{position:relative;min-height:0}#map{height:100%;width:100%;background:#eef2f7}.leaflet-container{font:12px/1.4 Arial,Helvetica,sans-serif}.tooltip-title{font-weight:700;margin-bottom:5px}.legend{background:rgba(255,255,255,.96);padding:9px 10px;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.22);line-height:1.35;max-width:245px}.legend-title{font-weight:700;margin-bottom:6px}.legend-row{display:flex;align-items:center;gap:7px;margin:3px 0}.legend-swatch{width:14px;height:14px;border:1px solid rgba(0,0,0,.25);flex:0 0 14px}#overseas{position:absolute;left:10px;bottom:10px;z-index:900;display:flex;gap:8px;align-items:flex-end;pointer-events:none;overflow:visible}.inset-card{position:relative;width:145px;height:120px;background:rgba(255,255,255,.97);border:1px solid #cbd5e1;border-radius:7px;box-shadow:0 1px 5px rgba(0,0,0,.18);overflow:visible;pointer-events:auto}.inset-card:hover{z-index:1500}.inset-title{height:22px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border-bottom:1px solid #e5e7eb;background:#fff;border-radius:7px 7px 0 0}.inset-map{height:97px;width:100%;overflow:visible!important}.inset-map.leaflet-container{overflow:visible!important;border-radius:0 0 7px 7px}.inset-map .leaflet-control-container{display:none}.inset-map .leaflet-tooltip-pane{z-index:10000}.inset-tooltip{min-width:190px;max-width:300px;white-space:normal;z-index:10001!important;box-shadow:0 2px 8px rgba(0,0,0,.25)}.poly-card{height:120px;padding:0;display:flex;flex-direction:column}.poly-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;text-align:center;border-radius:0 0 7px 7px}.poly-value{font-size:24px;font-weight:800;line-height:1}.poly-status{margin-top:7px;font-size:10px;line-height:1.25;color:#374151}#error{display:none;position:absolute;inset:16px;z-index:2000;background:rgba(255,255,255,.97);border:1px solid #fecaca;border-radius:8px;padding:16px;color:#991b1b;overflow:auto}@media(max-width:900px){#overseas{display:grid;grid-template-columns:repeat(3,110px);gap:5px}.inset-card{width:110px;height:96px}.inset-title{height:19px;font-size:9px}.inset-map{height:76px}.poly-card{height:96px}.poly-value{font-size:20px}}
</style></head><body><div id="app"><div id="header"><div><div id="title">Activité des EMIZ</div><div id="subtitle">En attente des données Grist…</div></div><div id="status"></div></div><div id="mapWrap"><div id="map"></div><div id="overseas"></div><div id="error"></div></div></div><script>
'use strict';
const GEOJSON_URL='https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/regions-avec-outre-mer.geojson';
const COLORS={green:'#2e7d32',orange:'#ed6c02',red:'#c62828',grey:'#d1d5db',blue1:'#dbeafe',blue2:'#bfdbfe',blue3:'#93c5fd',blue4:'#60a5fa',blue5:'#2563eb',real0:'#991b1b',real1:'#c62828',real2:'#ef9a9a',real3:'#f59e0b',real4:'#a5d6a7',real5:'#66bb6a',real6:'#43a047'};
const ZONES={'ZD-PARIS':['Île-de-France'],'ZD-NORD':['Hauts-de-France'],'ZD-OUEST':['Bretagne','Centre-Val de Loire','Normandie','Pays de la Loire'],'ZD-EST':['Grand Est','Bourgogne-Franche-Comté'],'ZD-SUD-OUEST':['Nouvelle-Aquitaine'],'ZD-SUD-EST':['Auvergne-Rhône-Alpes'],'ZD-SUD':['Corse','Occitanie','Provence-Alpes-Côte d\'Azur'],'ZD-ANTILLES':['Guadeloupe','Martinique'],'ZD-GUYANE':['Guyane']};
const METRO=['ZD-PARIS','ZD-NORD','ZD-OUEST','ZD-EST','ZD-SUD-OUEST','ZD-SUD-EST','ZD-SUD'];const OVERSEAS=[['ZD-ANTILLES','Antilles'],['ZD-GUYANE','Guyane']];
const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:4});map.attributionControl.addAttribution('Contours régionaux : IGN / INSEE – GeoJSON gregoiredavid');map.setView([46.6,2.4],5.2);
let regionData=null,zoneFeatures={},geoLayer=null,legendControl=null,currentRecords=[],rowByZone=new Map(),insetMaps=[];
function rows(t){const out=[],ids=t&&t.id;if(!ids||!ids.length)return out;for(let i=0;i<ids.length;i++){const r={id:ids[i]};Object.keys(t).forEach(k=>{if(k!=='id'&&Array.isArray(t[k]))r[k]=t[k][i]});out.push(r)}return out}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function normalize(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").trim().toLowerCase()}
function zoneCode(r){if(!r)return'';const cle=String(r.Cle_Annee_Zone||'').trim();const p=cle.indexOf('|');if(p>=0)return cle.slice(p+1).trim().toUpperCase();const z=r.Zone;if(typeof z==='string'&&/^ZD-/i.test(z))return z.trim().toUpperCase();return''}
function selected(r){return !('Annee_selectionnee' in r)||r.Annee_selectionnee===true||r.Annee_selectionnee===1}
function yearFromRecords(records){for(const r of records){const m=String(r.Cle_Annee_Zone||'').match(/^(\d{4})\|/);if(m)return m[1]}return''}
function mode(records){for(const r of records){const t=r.Theme;if(t&&typeof t==='object'&&t.Code)return String(t.Code).toUpperCase()}const s=records.map(r=>String(r.Statut||'')),has=t=>s.some(x=>x.indexOf(t)>=0);if(has('Objectif atteint')||has('Objectif non atteint'))return'OBJECTIF';if(has('Objectif prévisionnel atteint')||has('Objectif prévisionnel non atteint'))return'PREVISION';if(has('en retard')||has('Aucun exercice en retard'))return'RETARD';if(s.some(x=>/exercice\(s\) réalisé\(s\)/i.test(x)))return'REALISES';if(s.some(x=>/exercice\(s\) programmé\(s\)/i.test(x)))return'PROGRAMMES';return'GENERIC'}
function modeLabel(m){return{OBJECTIF:'Atteinte de l’objectif',PREVISION:'Atteinte prévisionnelle',REALISES:'Nombre d’exercices réalisés',PROGRAMMES:'Nombre d’exercices programmés',RETARD:'Exercices programmés en retard'}[m]||'Indicateur sélectionné'}
function breaks(records){const v=records.map(r=>Number(r.Valeur)).filter(x=>Number.isFinite(x)&&x>=0),mx=v.length?Math.max.apply(null,v):0;if(mx<=0)return[0,1,2,3,4];return[0,Math.max(1,Math.ceil(mx*.25)),Math.max(1,Math.ceil(mx*.5)),Math.max(1,Math.ceil(mx*.75)),mx]}
function realisedColor(v){if(v<=0)return COLORS.real0;if(v===1)return COLORS.real1;if(v===2)return COLORS.real2;if(v===3)return COLORS.real3;if(v===4)return COLORS.real4;if(v===5)return COLORS.real5;return COLORS.real6}
function styleFor(r,m,b){const base={color:'#fff',weight:1.4,fillOpacity:.88};if(!r)return Object.assign({},base,{fillColor:COLORS.grey,fillOpacity:.5});const s=String(r.Statut||'');if(m==='OBJECTIF'){if(s==='Objectif atteint')return Object.assign({},base,{fillColor:COLORS.green});if(s==='Objectif non atteint')return Object.assign({},base,{fillColor:COLORS.red});return Object.assign({},base,{fillColor:COLORS.grey})}if(m==='PREVISION'){if(s==='Objectif prévisionnel atteint')return Object.assign({},base,{fillColor:COLORS.green});if(s==='Objectif prévisionnel non atteint')return Object.assign({},base,{fillColor:COLORS.red});return Object.assign({},base,{fillColor:COLORS.grey})}if(m==='RETARD'){const v=Number(r.Valeur);return Object.assign({},base,{fillColor:(!Number.isFinite(v)||v===0)?COLORS.green:COLORS.red})}if(m==='REALISES'){const v=Number(r.Valeur);return Object.assign({},base,{fillColor:Number.isFinite(v)?realisedColor(Math.max(0,Math.round(v))):COLORS.grey})}const v=Number(r.Valeur);if(!Number.isFinite(v)||v<=0)return Object.assign({},base,{fillColor:COLORS.grey});if(v<=b[1])return Object.assign({},base,{fillColor:COLORS.blue1});if(v<=b[2])return Object.assign({},base,{fillColor:COLORS.blue2});if(v<=b[3])return Object.assign({},base,{fillColor:COLORS.blue3});if(v<b[4])return Object.assign({},base,{fillColor:COLORS.blue4});return Object.assign({},base,{fillColor:COLORS.blue5})}
function tooltip(r,zone){if(!r)return'<div class="tooltip-title">'+esc(zone)+'</div>Aucune donnée pour l’année sélectionnée.';const raw=String(r.Infobulle||'');if(raw)return raw.split('\n').map((x,i)=>i===0?'<div class="tooltip-title">'+esc(x)+'</div>':esc(x)).join('<br>');return'<div class="tooltip-title">'+esc(zone)+'</div>'+esc(r.Statut||'')}
function legendRows(m,b){if(m==='OBJECTIF')return[[COLORS.green,'Objectif atteint'],[COLORS.red,'Objectif non atteint'],[COLORS.grey,'Sans donnée']];if(m==='PREVISION')return[[COLORS.green,'Objectif prévisionnel atteint'],[COLORS.red,'Objectif prévisionnel non atteint'],[COLORS.grey,'Sans donnée']];if(m==='RETARD')return[[COLORS.green,'Aucun exercice en retard'],[COLORS.red,'Au moins un exercice en retard'],[COLORS.grey,'Sans donnée']];if(m==='REALISES')return[[COLORS.real0,'0'],[COLORS.real1,'1'],[COLORS.real2,'2'],[COLORS.real3,'3'],[COLORS.real4,'4'],[COLORS.real5,'5'],[COLORS.real6,'6 et +']];return[[COLORS.grey,'0'],[COLORS.blue1,'1 à '+b[1]],[COLORS.blue2,(b[1]+1)+' à '+b[2]],[COLORS.blue3,(b[2]+1)+' à '+b[3]],[COLORS.blue4,(b[3]+1)+' à '+Math.max(b[3]+1,b[4]-1)],[COLORS.blue5,b[4]+' et +']]}
function updateLegend(m,b){if(legendControl)map.removeControl(legendControl);legendControl=L.control({position:'bottomright'});legendControl.onAdd=function(){const d=L.DomUtil.create('div','legend');d.innerHTML='<div class="legend-title">'+esc(modeLabel(m))+'</div>'+legendRows(m,b).map(x=>'<div class="legend-row"><span class="legend-swatch" style="background:'+x[0]+'"></span><span>'+esc(x[1])+'</span></div>').join('');return d};legendControl.addTo(map)}
function addHover(layer,baseStyle){layer.on({mouseover:e=>e.target.setStyle({weight:2.6,color:'#111827',fillOpacity:.96}),mouseout:e=>e.target.setStyle(baseStyle())})}
function findRegion(name){const n=normalize(name);return regionData.features.find(f=>normalize(f.properties&&f.properties.nom)===n)}
function buildZoneFeatures(){zoneFeatures={};Object.keys(ZONES).forEach(z=>{const fs=ZONES[z].map(findRegion).filter(Boolean);if(!fs.length)return;let merged=fs[0];for(let i=1;i<fs.length;i++){try{merged=turf.union(merged,fs[i])||merged}catch(e){}}merged.properties=Object.assign({},merged.properties,{zone:z,nom:z});zoneFeatures[z]=merged})}
function renderInsets(m,b){insetMaps.forEach(x=>x.remove());insetMaps=[];const host=document.getElementById('overseas');host.innerHTML='';OVERSEAS.forEach(pair=>{const z=pair[0],name=pair[1],f=zoneFeatures[z];if(!f)return;const card=document.createElement('div');card.className='inset-card';card.innerHTML='<div class="inset-title">'+esc(name)+'</div><div class="inset-map" id="inset-'+z+'"></div>';host.appendChild(card);const im=L.map('inset-'+z,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false});const r=rowByZone.get(z),insetStyle=()=>styleFor(r,m,b);const layer=L.geoJSON(f,{style:insetStyle,onEachFeature:(ft,ly)=>{ly.bindTooltip(tooltip(r,z),{sticky:true,direction:'top',offset:[0,-8],opacity:.97,className:'inset-tooltip'});addHover(ly,insetStyle)}}).addTo(im);im.fitBounds(layer.getBounds(),{padding:[8,8],maxZoom:8});insetMaps.push(im)});const zp='ZD-POLYNESIE',rp=rowByZone.get(zp),card=document.createElement('div');card.className='inset-card poly-card';const st=styleFor(rp,m,b),val=rp&&rp.Valeur!=null?rp.Valeur:'—';card.innerHTML='<div class="inset-title">Polynésie</div><div class="poly-body" style="background:'+st.fillColor+'"><div class="poly-value">'+esc(val)+'</div><div class="poly-status">'+esc(rp?rp.Statut:'Aucune donnée')+'</div></div>';card.title=rp?String(rp.Infobulle||rp.Statut||''):'Aucune donnée';host.appendChild(card)}
function redraw(){if(!regionData)return;const filtered=currentRecords.filter(selected);rowByZone=new Map();filtered.forEach(r=>{const z=zoneCode(r);if(z)rowByZone.set(z,r)});const m=mode(filtered),b=breaks(filtered);if(geoLayer)geoLayer.remove();const features=METRO.map(z=>zoneFeatures[z]).filter(Boolean);geoLayer=L.geoJSON({type:'FeatureCollection',features:features},{style:f=>styleFor(rowByZone.get(f.properties.zone),m,b),onEachFeature:(f,l)=>{const z=f.properties.zone,r=rowByZone.get(z),baseStyle=()=>styleFor(r,m,b);l.bindTooltip(tooltip(r,z),{sticky:true,direction:'auto',opacity:.97});addHover(l,baseStyle)}}).addTo(map);map.fitBounds([[41.1,-5.4],[51.3,9.8]],{padding:[10,10]});renderInsets(m,b);updateLegend(m,b);const y=yearFromRecords(filtered);document.getElementById('subtitle').textContent=(y?'Année '+y+' · ':'')+modeLabel(m);document.getElementById('status').textContent=filtered.length+' EMIZ'}
function showError(e){const d=document.getElementById('error');d.style.display='block';d.textContent='Erreur du widget : '+(e&&e.message?e.message:String(e));document.getElementById('status').textContent='Erreur'}
async function refreshFromTable(){try{const t=await grist.docApi.fetchTable('CARTE_EMIZ');currentRecords=rows(t);redraw()}catch(e){console.warn(e)}}
fetch(GEOJSON_URL).then(r=>{if(!r.ok)throw new Error('Chargement GeoJSON impossible');return r.json()}).then(g=>{regionData=g;buildZoneFeatures();redraw()}).catch(showError);
try{grist.ready({requiredAccess:'full'});grist.onRecords(function(records){currentRecords=Array.isArray(records)?records:[];redraw()},{expandRefs:true});setInterval(refreshFromTable,1000);setTimeout(refreshFromTable,700)}catch(e){showError(e)}
</script></body></html>
