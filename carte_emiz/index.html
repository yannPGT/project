<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Carte EMIZ SYNAPSE</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<style>
html,body{margin:0;height:100%;width:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#1f2937;background:#f8fafc}#app{display:grid;grid-template-rows:auto 1fr;height:100%;width:100%}#header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:#fff;border-bottom:1px solid #e5e7eb;z-index:1000}#title{font-size:16px;font-weight:700}#subtitle,#status{font-size:12px;color:#6b7280}#subtitle{margin-top:2px}#status{white-space:nowrap}#mapWrap{position:relative;min-height:0}#map{height:100%;width:100%;background:#eef2f7}.leaflet-container{font:12px/1.4 Arial,Helvetica,sans-serif}.tooltip-title{font-weight:700;margin-bottom:5px}.legend{background:rgba(255,255,255,.96);padding:9px 10px;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.22);line-height:1.35;max-width:245px}.legend-title{font-weight:700;margin-bottom:6px}.legend-row{display:flex;align-items:center;gap:7px;margin:3px 0}.legend-swatch{width:14px;height:14px;border:1px solid rgba(0,0,0,.25);flex:0 0 14px}#overseas{position:absolute;left:10px;bottom:10px;z-index:900;display:flex;gap:7px;align-items:flex-end;pointer-events:none;overflow:visible}.inset-card{position:relative;width:132px;height:116px;background:rgba(255,255,255,.97);border:1px solid #cbd5e1;border-radius:7px;box-shadow:0 1px 5px rgba(0,0,0,.18);overflow:visible;pointer-events:auto}.inset-card:hover{z-index:1500}.inset-title{height:22px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border-bottom:1px solid #e5e7eb;background:#fff;border-radius:7px 7px 0 0;text-align:center;padding:0 3px}.inset-map{height:93px;width:100%;overflow:visible!important}.inset-map.leaflet-container{overflow:visible!important;border-radius:0 0 7px 7px}.inset-map .leaflet-control-container{display:none}.inset-map .leaflet-tooltip-pane{z-index:10000}.inset-tooltip{min-width:190px;max-width:300px;white-space:normal;z-index:10001!important;box-shadow:0 2px 8px rgba(0,0,0,.25)}.data-card{display:flex;flex-direction:column}.data-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center;border-radius:0 0 7px 7px}.data-value{font-size:23px;font-weight:800;line-height:1}.data-status{margin-top:6px;font-size:9px;line-height:1.2;color:#374151}#error{display:none;position:absolute;inset:16px;z-index:2000;background:rgba(255,255,255,.97);border:1px solid #fecaca;border-radius:8px;padding:16px;color:#991b1b;overflow:auto}@media(max-width:900px){#overseas{display:grid;grid-template-columns:repeat(3,105px);gap:4px}.inset-card{width:105px;height:92px}.inset-title{height:19px;font-size:8px}.inset-map{height:72px}.data-value{font-size:19px}}
</style></head><body><div id="app"><div id="header"><div><div id="title">Activité des EMIZ</div><div id="subtitle">En attente des données Grist…</div></div><div id="status"></div></div><div id="mapWrap"><div id="map"></div><div id="overseas"></div><div id="error"></div></div></div><script>
'use strict';
const TABLE='CARTE_EMIZ';
const GEOJSON_URL='https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/regions-avec-outre-mer.geojson';
const COLORS={green:'#2e7d32',orange:'#ed6c02',red:'#c62828',grey:'#d1d5db',blue1:'#dbeafe',blue2:'#bfdbfe',blue3:'#93c5fd',blue4:'#60a5fa',blue5:'#2563eb',real0:'#991b1b',real1:'#c62828',real2:'#ef9a9a',real3:'#f59e0b',real4:'#a5d6a7',real5:'#66bb6a',real6:'#43a047'};
const ZONES={'ZD-PARIS':['Île-de-France'],'ZD-NORD':['Hauts-de-France'],'ZD-OUEST':['Bretagne','Centre-Val de Loire','Normandie','Pays de la Loire'],'ZD-EST':['Grand Est','Bourgogne-Franche-Comté'],'ZD-SUD-OUEST':['Nouvelle-Aquitaine'],'ZD-SUD-EST':['Auvergne-Rhône-Alpes'],'ZD-SUD':['Corse','Occitanie','Provence-Alpes-Côte d\'Azur'],'ZD-ANTILLES':['Guadeloupe','Martinique'],'ZD-SUD-OCEAN-INDIEN':['La Réunion','Mayotte']};
const METRO=['ZD-PARIS','ZD-NORD','ZD-OUEST','ZD-EST','ZD-SUD-OUEST','ZD-SUD-EST','ZD-SUD'];
const OVERSEAS_MAP=[['ZD-ANTILLES','Antilles'],['ZD-SUD-OCEAN-INDIEN','Sud Océan Indien']];
const OVERSEAS_CARDS=[['ZD-CALEDONIE','Nouvelle-Calédonie'],['ZD-POLYNESIE','Polynésie française']];
const map=L.map('map',{zoomControl:true,attributionControl:true,minZoom:4});map.attributionControl.addAttribution('Contours régionaux : IGN / INSEE – GeoJSON gregoiredavid');map.setView([46.6,2.4],5.2);
let regionData=null,zoneFeatures={},geoLayer=null,legendControl=null,currentRecords=[],rowByZone=new Map(),insetMaps=[],lastSignature='';
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function normalize(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").trim().toLowerCase()}
function rows(t){const out=[];if(!t||!Array.isArray(t.id))return out;for(let i=0;i<t.id.length;i++){const r={id:t.id[i]};for(const k of Object.keys(t)){if(k!=='id'&&Array.isArray(t[k]))r[k]=t[k][i]}out.push(r)}return out}
function zoneCode(r){if(!r)return'';const src=String(r.Cle_Annee_Zone||r.Zone||'').toUpperCase();const known=['ZD-SAINT-PIERRE-ET-MIQUELON','ZD-SUD-OCEAN-INDIEN','ZD-SUD-OUEST','ZD-SUD-EST','ZD-POLYNESIE','ZD-CALEDONIE','ZD-ANTILLES','ZD-PARIS','ZD-NORD','ZD-OUEST','ZD-EST','ZD-SUD'];return known.find(z=>src.includes(z))||''}
function selected(r){const v=r&&r.Annee_selectionnee;return v===true||v===1||v==='true'||v==='True'}
function yearFromRecords(records){for(const r of records){const m=String(r.Cle_Annee_Zone||'').match(/^(\d{4})\|/);if(m)return m[1]}return''}
function mode(records){const s=records.map(r=>String(r.Statut||'')),has=t=>s.some(x=>x.includes(t));if(has('Objectif prévisionnel atteint')||has('Objectif prévisionnel non atteint'))return'PREVISION';if(has('Objectif atteint')||has('Objectif non atteint'))return'OBJECTIF';if(has('en retard')||has('Aucun exercice en retard'))return'RETARD';if(s.some(x=>/exercice\(s\) réalisé\(s\)/i.test(x)))return'REALISES';if(s.some(x=>/exercice\(s\) programmé\(s\)/i.test(x)))return'PROGRAMMES';return'GENERIC'}
function modeLabel(m){return{OBJECTIF:'Atteinte de l’objectif',PREVISION:'Atteinte prévisionnelle',REALISES:'Nombre d’exercices réalisés',PROGRAMMES:'Nombre d’exercices programmés',RETARD:'Exercices programmés en retard'}[m]||'Indicateur sélectionné'}
function breaks(records){const v=records.map(r=>Number(r.Valeur)).filter(x=>Number.isFinite(x)&&x>=0),mx=v.length?Math.max(...v):0;if(mx<=0)return[0,1,2,3,4];return[0,Math.max(1,Math.ceil(mx*.25)),Math.max(1,Math.ceil(mx*.5)),Math.max(1,Math.ceil(mx*.75)),mx]}
function realisedColor(v){if(v<=0)return COLORS.real0;if(v===1)return COLORS.real1;if(v===2)return COLORS.real2;if(v===3)return COLORS.real3;if(v===4)return COLORS.real4;if(v===5)return COLORS.real5;return COLORS.real6}
function styleFor(r,m,b){const base={color:'#fff',weight:1.4,fillOpacity:.88};if(!r)return{...base,fillColor:COLORS.grey,fillOpacity:.5};const s=String(r.Statut||'');if(m==='OBJECTIF'){if(s==='Objectif atteint')return{...base,fillColor:COLORS.green};if(s==='Objectif non atteint')return{...base,fillColor:COLORS.red};return{...base,fillColor:COLORS.grey}}if(m==='PREVISION'){if(s==='Objectif prévisionnel atteint')return{...base,fillColor:COLORS.green};if(s==='Objectif prévisionnel non atteint')return{...base,fillColor:COLORS.red};return{...base,fillColor:COLORS.grey}}if(m==='RETARD'){const v=Number(r.Valeur);return{...base,fillColor:(!Number.isFinite(v)||v===0)?COLORS.green:COLORS.red}}if(m==='REALISES'){const v=Number(r.Valeur);return{...base,fillColor:Number.isFinite(v)?realisedColor(Math.max(0,Math.round(v))):COLORS.grey}}const v=Number(r.Valeur);if(!Number.isFinite(v)||v<=0)return{...base,fillColor:COLORS.grey};if(v<=b[1])return{...base,fillColor:COLORS.blue1};if(v<=b[2])return{...base,fillColor:COLORS.blue2};if(v<=b[3])return{...base,fillColor:COLORS.blue3};if(v<b[4])return{...base,fillColor:COLORS.blue4};return{...base,fillColor:COLORS.blue5}}
function tooltip(r,zone){if(!r)return'<div class="tooltip-title">'+esc(zone)+'</div>Aucune donnée pour l’année sélectionnée.';const raw=String(r.Infobulle||'');if(raw)return raw.split('\n').map((x,i)=>i===0?'<div class="tooltip-title">'+esc(x)+'</div>':esc(x)).join('<br>');return'<div class="tooltip-title">'+esc(zone)+'</div>'+esc(r.Statut||'')}
function legendRows(m,b){if(m==='OBJECTIF')return[[COLORS.green,'Objectif atteint'],[COLORS.red,'Objectif non atteint'],[COLORS.grey,'Sans donnée']];if(m==='PREVISION')return[[COLORS.green,'Objectif prévisionnel atteint'],[COLORS.red,'Objectif prévisionnel non atteint'],[COLORS.grey,'Sans donnée']];if(m==='RETARD')return[[COLORS.green,'Aucun exercice en retard'],[COLORS.red,'Au moins un exercice en retard'],[COLORS.grey,'Sans donnée']];if(m==='REALISES')return[[COLORS.real0,'0'],[COLORS.real1,'1'],[COLORS.real2,'2'],[COLORS.real3,'3'],[COLORS.real4,'4'],[COLORS.real5,'5'],[COLORS.real6,'6 et +']];return[[COLORS.grey,'0'],[COLORS.blue1,'1 à '+b[1]],[COLORS.blue2,(b[1]+1)+' à '+b[2]],[COLORS.blue3,(b[2]+1)+' à '+b[3]],[COLORS.blue4,(b[3]+1)+' à '+Math.max(b[3]+1,b[4]-1)],[COLORS.blue5,b[4]+' et +']]}
function updateLegend(m,b){if(legendControl)map.removeControl(legendControl);legendControl=L.control({position:'bottomright'});legendControl.onAdd=()=>{const d=L.DomUtil.create('div','legend');d.innerHTML='<div class="legend-title">'+esc(modeLabel(m))+'</div>'+legendRows(m,b).map(x=>'<div class="legend-row"><span class="legend-swatch" style="background:'+x[0]+'"></span><span>'+esc(x[1])+'</span></div>').join('');return d};legendControl.addTo(map)}
function addHover(layer,baseStyle){layer.on({mouseover:e=>e.target.setStyle({weight:2.6,color:'#111827',fillOpacity:.96}),mouseout:e=>e.target.setStyle(baseStyle())})}
function findRegion(name){const n=normalize(name);return regionData.features.find(f=>normalize(f.properties&&f.properties.nom)===n)}
function buildZoneFeatures(){zoneFeatures={};Object.keys(ZONES).forEach(z=>{const fs=ZONES[z].map(findRegion).filter(Boolean);if(!fs.length)return;let merged=fs[0];for(let i=1;i<fs.length;i++){try{merged=turf.union(merged,fs[i])||merged}catch(e){}}merged.properties={...(merged.properties||{}),zone:z,nom:z};zoneFeatures[z]=merged})}
function dataCard(z,name,m,b){const r=rowByZone.get(z),st=styleFor(r,m,b),val=r&&r.Valeur!=null?r.Valeur:'—',card=document.createElement('div');card.className='inset-card data-card';card.innerHTML='<div class="inset-title">'+esc(name)+'</div><div class="data-body" style="background:'+st.fillColor+'"><div class="data-value">'+esc(val)+'</div><div class="data-status">'+esc(r?r.Statut:'Aucune donnée')+'</div></div>';card.title=r?String(r.Infobulle||r.Statut||''):'Aucune donnée';return card}
function renderInsets(m,b){insetMaps.forEach(x=>x.remove());insetMaps=[];const host=document.getElementById('overseas');host.innerHTML='';OVERSEAS_MAP.forEach(([z,name])=>{const f=zoneFeatures[z];if(!f){host.appendChild(dataCard(z,name,m,b));return}const card=document.createElement('div');card.className='inset-card';card.innerHTML='<div class="inset-title">'+esc(name)+'</div><div class="inset-map" id="inset-'+z+'"></div>';host.appendChild(card);const im=L.map('inset-'+z,{zoomControl:false,attributionControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,touchZoom:false});const r=rowByZone.get(z),insetStyle=()=>styleFor(r,m,b);const layer=L.geoJSON(f,{style:insetStyle,onEachFeature:(ft,ly)=>{ly.bindTooltip(tooltip(r,z),{sticky:true,direction:'top',offset:[0,-8],opacity:.97,className:'inset-tooltip'});addHover(ly,insetStyle)}}).addTo(im);im.fitBounds(layer.getBounds(),{padding:[8,8],maxZoom:8});insetMaps.push(im)});OVERSEAS_CARDS.forEach(([z,name])=>host.appendChild(dataCard(z,name,m,b)))}
function redraw(){if(!regionData)return;const filtered=currentRecords.filter(selected);rowByZone=new Map();filtered.forEach(r=>{const z=zoneCode(r);if(z)rowByZone.set(z,r)});const m=mode(filtered),b=breaks(filtered);if(geoLayer)geoLayer.remove();const fs=METRO.map(z=>zoneFeatures[z]).filter(Boolean);geoLayer=L.geoJSON({type:'FeatureCollection',features:fs},{style:f=>styleFor(rowByZone.get(f.properties.zone),m,b),onEachFeature:(f,l)=>{const z=f.properties.zone,r=rowByZone.get(z),base=()=>styleFor(r,m,b);l.bindTooltip(tooltip(r,z),{sticky:true,direction:'auto',opacity:.97});addHover(l,base)}}).addTo(map);map.fitBounds([[41.1,-5.4],[51.3,9.8]],{padding:[10,10]});renderInsets(m,b);updateLegend(m,b);const y=yearFromRecords(filtered);document.getElementById('subtitle').textContent=(y?'Année '+y+' · ':'')+modeLabel(m);document.getElementById('status').textContent=filtered.filter(r=>zoneCode(r)!=='').length+' EMIZ'}
function showError(e){const d=document.getElementById('error');d.style.display='block';d.textContent='Erreur widget : '+(e&&e.message?e.message:String(e));document.getElementById('status').textContent='Erreur'}
function signature(a){return a.filter(selected).map(r=>[r.id,r.Cle_Annee_Zone,r.Valeur,r.Statut].join('|')).join('~')}
async function refresh(){try{const t=await grist.docApi.fetchTable(TABLE);const data=rows(t);const sig=signature(data);if(sig!==lastSignature){lastSignature=sig;currentRecords=data;document.getElementById('error').style.display='none';redraw()}}catch(e){showError(e)}}
fetch(GEOJSON_URL).then(r=>{if(!r.ok)throw new Error('Chargement GeoJSON impossible');return r.json()}).then(g=>{regionData=g;buildZoneFeatures();redraw()}).catch(showError);
try{grist.ready({requiredAccess:'full'});setTimeout(refresh,250);setInterval(refresh,1000)}catch(e){showError(e)}
</script></body></html>
