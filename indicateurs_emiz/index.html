<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Indicateurs EMIZ</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#1f2937;overflow:hidden}
#app{height:100%;box-sizing:border-box;padding:10px;display:flex;flex-direction:column;gap:8px}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.title{font-size:16px;font-weight:700}.subtitle{font-size:12px;color:#6b7280;margin-top:2px}.year{font-size:12px;color:#6b7280;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;flex:1;min-height:0}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.04);min-width:0}
.label{font-size:11px;color:#6b7280;line-height:1.25}.value{font-size:24px;font-weight:700;line-height:1.1;margin-top:6px}.detail{font-size:11px;color:#6b7280;margin-top:4px;line-height:1.2}.good{color:#166534}.warn{color:#b45309}.bad{color:#b91c1c}.neutral{color:#1f2937}
#error{display:none;background:#fff;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;overflow:auto}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));overflow:auto}.value{font-size:21px}}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div><div class="title">Synthèse nationale EMIZ</div><div class="subtitle">Activité propre des états-majors interministériels de zone</div></div>
    <div class="year" id="year"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div id="error"></div>
</div>
<script>
'use strict';
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function pct(v){return Math.round(num(v)*100)}
function getYear(r){
  const a=r?.Annee;
  if(a&&typeof a==='object'){
    if(a.Annee!==undefined)return a.Annee;
    if(a.displayValue!==undefined)return a.displayValue;
    if(a.rowId!==undefined)return a.rowId;
  }
  if(a!==undefined&&a!==null)return a;
  return '';
}
function selected(r){return !('Annee_selectionnee' in r)||r.Annee_selectionnee===true||r.Annee_selectionnee===1}
function card(label,value,detail,cls='neutral'){
  return `<div class="card"><div><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div></div><div class="detail">${esc(detail||'')}</div></div>`;
}
function render(records){
  const rows=(records||[]).filter(selected);
  const r=rows[0]||records?.[0];
  const grid=document.getElementById('grid');
  const year=document.getElementById('year');
  if(!r){grid.innerHTML=card('Données','—','Aucune ligne disponible','bad');year.textContent='';return;}
  const y=getYear(r); year.textContent=y?`Année ${y}`:'';
  const nbEmiz=num(r.Nb_EMIZ), realised=num(r.Nb_Exercices_Realises), programmed=num(r.Nb_Exercices_Programmes), late=num(r.Nb_Exercices_En_Retard);
  const objCount=num(r.Nb_EMIZ_Objectif_Atteint), objPct=pct(r.Pct_EMIZ_Objectif_Atteint);
  const prevCount=num(r.Nb_EMIZ_Prevision_Atteinte), prevPct=pct(r.Pct_EMIZ_Prevision_Atteinte);
  grid.innerHTML=[
    card('Exercices réalisés',realised,`${nbEmiz} EMIZ suivies`,'neutral'),
    card('Exercices programmés',programmed,'Programmations restantes / à venir','neutral'),
    card('EMIZ ayant atteint l’objectif',`${objPct} %`,`${objCount} sur ${nbEmiz}` ,objPct>=80?'good':objPct>=50?'warn':'bad'),
    card('EMIZ en prévision d’atteinte',`${prevPct} %`,`${prevCount} sur ${nbEmiz}` ,prevPct>=80?'good':prevPct>=50?'warn':'bad'),
    card('Exercices en retard',late,late===0?'Aucun exercice programmé en retard':'Programmations dépassées',late===0?'good':'bad')
  ].join('');
}
function showError(e){const box=document.getElementById('error');box.style.display='block';box.textContent='Erreur widget : '+(e?.message||e);}
grist.ready({requiredAccess:'read table'});
grist.onRecords(records=>{try{document.getElementById('error').style.display='none';render(records)}catch(e){showError(e)}});
</script>
</body>
</html>
