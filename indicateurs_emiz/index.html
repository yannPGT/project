<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Indicateurs EMIZ</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#1f2937;overflow:hidden}
#app{height:100%;box-sizing:border-box;padding:10px;display:flex;flex-direction:column;gap:8px}
.header{display:block}.titleline{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.title{font-size:16px;font-weight:700}.year{font-size:14px;font-weight:700;color:#4b5563;white-space:nowrap}.subtitle{font-size:12px;color:#6b7280;margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;flex:1;min-height:0}.card{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.04);min-width:0}.label{font-size:11px;color:#6b7280;line-height:1.25}.value{font-size:24px;font-weight:700;line-height:1.1;margin-top:6px}.detail{font-size:11px;color:#6b7280;margin-top:4px;line-height:1.2}.good{color:#166534}.warn{color:#b45309}.bad{color:#b91c1c}.neutral{color:#1f2937}
#error{display:none;background:#fff;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;overflow:auto}@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));overflow:auto}.value{font-size:21px}}
</style>
</head>
<body>
<div id="app"><div class="header"><div class="titleline"><div class="title">Synthèse nationale EMIZ</div><div class="year" id="year"></div></div><div class="subtitle">Activité propre des états-majors interministériels de zone</div></div><div class="grid" id="grid"></div><div id="error"></div></div>
<script>
'use strict';
const TABLE='STATISTIQUES_GENERALE_EMIZ';
let lastSignature='';
let yearByRefId={};
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function pct(v){return Math.round(num(v)*100)}
function rows(t){const out=[];if(!t||!Array.isArray(t.id))return out;for(let i=0;i<t.id.length;i++){const r={id:t.id[i]};for(const k of Object.keys(t)){if(k!=='id'&&Array.isArray(t[k]))r[k]=t[k][i]}out.push(r)}return out}
function refId(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return v;if(Array.isArray(v)){for(const x of v)if(typeof x==='number')return x}if(typeof v==='object'&&v.rowId!==undefined)return Number(v.rowId);const n=Number(v);return Number.isFinite(n)?n:null}
async function buildYearMap(){
  try{
    const tables=await grist.docApi.listTables();
    const candidates=tables.filter(n=>/ann[eé]e/i.test(String(n)));
    const names=candidates.length?candidates:tables;
    const found={};
    for(const name of names){
      try{
        const t=await grist.docApi.fetchTable(name);
        const rr=rows(t);
        for(const r of rr){
          for(const k of Object.keys(r)){
            if(k==='id')continue;
            const s=String(r[k]??'').trim();
            if(/^20\d{2}$/.test(s)&&found[r.id]===undefined)found[r.id]=s;
          }
        }
      }catch(e){}
    }
    yearByRefId=found;
  }catch(e){}
}
function getYear(r){
  const a=r?.Annee;
  if(a&&typeof a==='object'){
    if(a.Annee!==undefined&&/^20\d{2}$/.test(String(a.Annee)))return String(a.Annee);
    if(a.displayValue!==undefined&&/^20\d{2}$/.test(String(a.displayValue)))return String(a.displayValue);
  }
  if(Array.isArray(a))for(const v of a){const m=String(v??'').match(/20\d{2}/);if(m)return m[0]}
  const direct=String(a??'');const dm=direct.match(/20\d{2}/);if(dm)return dm[0];
  const id=refId(a);if(id!==null&&yearByRefId[id])return yearByRefId[id];
  return '';
}
function selected(r){return r&&('Annee_selectionnee' in r)&&(r.Annee_selectionnee===true||r.Annee_selectionnee===1)}
function card(label,value,detail,cls='neutral'){return `<div class="card"><div><div class="label">${esc(label)}</div><div class="value ${cls}">${esc(value)}</div></div><div class="detail">${esc(detail||'')}</div></div>`}
function render(records){
  const r=(records||[]).find(selected)||null;const grid=document.getElementById('grid'),year=document.getElementById('year');
  if(!r){grid.innerHTML=card('Données','—','Aucune année sélectionnée','bad');year.textContent='';return}
  const y=getYear(r);year.textContent=y?`— ${y}`:'';
  const nbEmiz=num(r.Nb_EMIZ),realised=num(r.Nb_Exercices_Realises),programmed=num(r.Nb_Exercices_Programmes),late=num(r.Nb_Exercices_En_Retard);
  const objCount=num(r.Nb_EMIZ_Objectif_Atteint),objPct=pct(r.Pct_EMIZ_Objectif_Atteint),prevCount=num(r.Nb_EMIZ_Prevision_Atteinte),prevPct=pct(r.Pct_EMIZ_Prevision_Atteinte);
  grid.innerHTML=[card('Exercices réalisés',realised,`${nbEmiz} EMIZ suivies`,'neutral'),card('Exercices programmés',programmed,'Programmations restantes / à venir','neutral'),card('EMIZ ayant atteint l’objectif',`${objPct} %`,`${objCount} sur ${nbEmiz}`,objPct>=80?'good':objPct>=50?'warn':'bad'),card('EMIZ en prévision d’atteinte',`${prevPct} %`,`${prevCount} sur ${nbEmiz}`,prevPct>=80?'good':prevPct>=50?'warn':'bad'),card('Exercices en retard',late,late===0?'Aucun exercice programmé en retard':'Programmations dépassées',late===0?'good':'bad')].join('')
}
function signature(records){const r=(records||[]).find(selected);if(!r)return'none';return[getYear(r),r.Nb_EMIZ,r.Nb_Exercices_Realises,r.Nb_Exercices_Programmes,r.Nb_EMIZ_Objectif_Atteint,r.Pct_EMIZ_Objectif_Atteint,r.Nb_EMIZ_Prevision_Atteinte,r.Pct_EMIZ_Prevision_Atteinte,r.Nb_Exercices_En_Retard].join('|')}
function showError(e){const b=document.getElementById('error');b.style.display='block';b.textContent='Erreur widget : '+(e?.message||e)}function hideError(){document.getElementById('error').style.display='none'}
async function refresh(){try{const table=await grist.docApi.fetchTable(TABLE);const data=rows(table);const sig=signature(data);if(sig!==lastSignature){lastSignature=sig;render(data)}hideError()}catch(e){showError(e)}}
async function init(){await buildYearMap();await refresh();setInterval(refresh,1000)}
grist.ready({requiredAccess:'full'});grist.onRecords(records=>{try{render(records||[])}catch(e){showError(e)}},{expandRefs:true});setTimeout(init,300);
</script>
</body>
</html>
