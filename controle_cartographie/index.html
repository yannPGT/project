<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contrôles cartographie SYNAPSE</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#1f2937;background:#f8fafc}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{padding:10px}.panel{height:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08)}.control{display:flex;align-items:center;gap:8px;min-width:0}label{font-size:12px;font-weight:700;color:#374151;white-space:nowrap}select{height:36px;min-width:150px;max-width:300px;padding:0 34px 0 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;color:#111827;font-size:13px;outline:none}#annee{min-width:95px}#theme{min-width:245px}#plan{min-width:260px}#planWrap{display:none}.status{margin-left:auto;font-size:11px;color:#6b7280;white-space:nowrap}.status.ok{color:#166534}.status.err{color:#991b1b}@media(max-width:850px){body{padding:6px}.panel{align-items:stretch;flex-direction:column;justify-content:center}.control{justify-content:space-between}.control select{flex:1;max-width:none}.status{margin-left:0;text-align:right}}
</style></head><body>
<div class="panel"><div class="control"><label for="annee">Année</label><select id="annee"></select></div><div class="control"><label for="theme">Thème cartographique</label><select id="theme"></select></div><div class="control" id="planWrap"><label for="plan">Plan</label><select id="plan"></select></div><div class="status" id="status">Initialisation…</div></div>
<script>
"use strict";
const TABLES={stats:'STATISTIQUES_GENERALE',themes:'THEMES_CARTOGRAPHIE',plans:'PLANS_CARTOGRAPHIE',choiceYear:'CHOIX_ANNEE_CARTOGRAPHIE',choiceTheme:'CHOIX_THEME_CARTOGRAPHIE',choicePlan:'CHOIX_PLAN_CARTOGRAPHIE'};
const els={year:document.getElementById('annee'),theme:document.getElementById('theme'),plan:document.getElementById('plan'),planWrap:document.getElementById('planWrap'),status:document.getElementById('status')};
let state={stats:null,themes:null,plans:null,choiceYear:null,choiceTheme:null,choicePlan:null},initialized=false;
function setStatus(t,c=''){els.status.textContent=t;els.status.className='status'+(c?' '+c:'')}
function rows(t){if(!t||!Array.isArray(t.id))return[];return t.id.map((id,i)=>{const r={id};for(const k of Object.keys(t))if(k!=='id'&&Array.isArray(t[k]))r[k]=t[k][i];return r})}
function refId(v){if(v==null||v==='')return null;if(typeof v==='number')return v;if(typeof v==='object'&&v.rowId!==undefined)return Number(v.rowId);if(Array.isArray(v)){if(v.length>=2&&typeof v[1]==='number')return v[1];const n=v.find(x=>typeof x==='number');return n??null}const n=Number(v);return Number.isFinite(n)?n:null}
function refDisplay(v){if(v==null)return'';if(typeof v==='string'||typeof v==='number')return String(v);if(Array.isArray(v)){for(let i=v.length-1;i>=0;i--)if(typeof v[i]==='string')return v[i]}if(typeof v==='object')return String(v.displayValue??v.value??'');return''}
function fill(s,it,label,value){s.innerHTML='';for(const x of it){const o=document.createElement('option');o.value=String(value?value(x):x.id);o.textContent=label(x);s.appendChild(o)}}
function selectedRef(t,c){const r=rows(t)[0];return r?refId(r[c]):null}
function selectedThemeRow(){const id=Number(els.theme.value);return rows(state.themes).find(r=>r.id===id)||null}
function updatePlanVisibility(){const t=selectedThemeRow();const isPlan=!!t&&(String(t.Code||'').trim().toUpperCase()==='PLAN'||String(t.Libelle||'').trim().toLowerCase()==='plans mis en œuvre'||String(t.Libelle||'').trim().toLowerCase()==='plans mis en oeuvre');els.planWrap.style.display=isPlan?'flex':'none'}
async function fetchNamed(name){setStatus('Chargement : '+name+'…');try{return await grist.docApi.fetchTable(name)}catch(e){throw new Error(name+' : '+(e?.message||String(e)))}}
async function writeRefChoice(tableName,column,value){const table=await grist.docApi.fetchTable(tableName),r=rows(table)[0];const n=Number(value);if(r)await grist.docApi.applyUserActions([['UpdateRecord',tableName,r.id,{[column]:n}]]);else await grist.docApi.applyUserActions([['AddRecord',tableName,null,{[column]:n}]])}
async function writeYearChoice(yearValue){const table=await grist.docApi.fetchTable(TABLES.choiceYear),r=rows(table)[0];if(!r)throw new Error('CHOIX_ANNEE_CARTOGRAPHIE ne contient aucune ligne.');const current=r.Annee;
  /* Annee est une référence : on retrouve son id depuis les valeurs présentes dans STATISTIQUES_GENERALE. */
  const candidates=rows(state.stats).filter(x=>refDisplay(x.Annee)===String(yearValue)||String(x.Annee)===String(yearValue));
  let target=null;for(const x of candidates){target=refId(x.Annee);if(target)break}
  if(!target){/* si STATISTIQUES_GENERALE expose directement l'id de référence */ for(const x of rows(state.stats)){if(refDisplay(x.Annee)===String(yearValue)){target=refId(x.Annee);break}}}
  if(!target)throw new Error('Impossible de retrouver la référence Grist pour l’année '+yearValue+'.');
  await grist.docApi.applyUserActions([['UpdateRecord',TABLES.choiceYear,r.id,{Annee:target}]])}
async function loadAll(){const stats=await fetchNamed(TABLES.stats),themes=await fetchNamed(TABLES.themes),plans=await fetchNamed(TABLES.plans),choiceYear=await fetchNamed(TABLES.choiceYear),choiceTheme=await fetchNamed(TABLES.choiceTheme),choicePlan=await fetchNamed(TABLES.choicePlan);state={stats,themes,plans,choiceYear,choiceTheme,choicePlan};
  const years=[...new Set(rows(stats).map(r=>refDisplay(r.Annee)||String(r.Annee??'')).filter(Boolean))].sort((a,b)=>Number(a)-Number(b));const themeRows=rows(themes),planRows=rows(plans).sort((a,b)=>String(a.Libelle||'').localeCompare(String(b.Libelle||''),'fr'));
  fill(els.year,years.map(y=>({y})),r=>r.y,r=>r.y);fill(els.theme,themeRows,r=>String(r.Libelle??r.Code??r.id));fill(els.plan,planRows,r=>String(r.Libelle??r.Code??r.id));
  const cy=rows(choiceYear)[0],currentYear=cy?(refDisplay(cy.Annee)||String(cy.Annee??'')):'';if(years.includes(currentYear))els.year.value=currentYear;const t=selectedRef(choiceTheme,'Theme'),p=selectedRef(choicePlan,'Plan');if(t&&themeRows.some(r=>r.id===t))els.theme.value=String(t);if(p&&planRows.some(r=>r.id===p))els.plan.value=String(p);updatePlanVisibility();setStatus('Prêt','ok')}
async function change(fn,after){try{setStatus('Mise à jour…');await fn();if(after)after();setStatus('Mis à jour','ok')}catch(e){console.error(e);setStatus('Erreur : '+(e?.message||String(e)),'err')}}
els.year.addEventListener('change',()=>change(()=>writeYearChoice(els.year.value)));els.theme.addEventListener('change',()=>change(()=>writeRefChoice(TABLES.choiceTheme,'Theme',els.theme.value),updatePlanVisibility));els.plan.addEventListener('change',()=>change(()=>writeRefChoice(TABLES.choicePlan,'Plan',els.plan.value));
grist.ready({requiredAccess:'full'});grist.onOptions(()=>{if(initialized)return;initialized=true;loadAll().catch(e=>{console.error(e);setStatus('Erreur : '+(e?.message||String(e)),'err')})});
</script></body></html>
