v></div><script>(function(){'use strict';var started=false,status=document.getElementById('status'),dateMajEl=document.getElementById('dateMaj'),yearSel=document.getElementById('annee'),themeSel=document.getElementById('theme'),themeEmizSel=document.getElementById('themeEmiz'),planSel=document.getElementById('plan'),planWrap=document.getElementById('planWrap'),state={yearMap:{}};function setStatus(t,c){status.textContent=t;status.className='status'+(c?' '+c:'')}function rows(t){var out=[],ids=t&&t.id;if(!ids||!ids.length)return out;for(var i=0;i<ids.length;i++){var r={id:ids[i]};Object.keys(t).forEach(function(k){if(k!=='id'&&Array.isArray(t[k]))r[k]=t[k][i]});out.push(r)}return out}function refId(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return v;if(Array.isArray(v)){for(var i=0;i<v.length;i++)if(typeof v[i]==='number')return v[i]}if(typeof v==='object'&&v.rowId!==undefined)return Number(v.rowId);var n=Number(v);return isFinite(n)?n:null}function fill(sel,items,getValue,getLabel){sel.innerHTML='';items.forEach(function(x){var o=document.createElement('option');o.value=String(getValue(x));o.textContent=String(getLabel(x));sel.appendChild(o)})}function firstRow(t){var a=rows(t);return a.length?a[0]:null}function findTable(list,wanted){if(list.indexOf(wanted)>=0)return wanted;var w=wanted.toLowerCase();for(var i=0;i<list.length;i++)if(String(list[i]).toLowerCase()===w)return list[i];return null}function formatMaj(v){if(v===null||v===undefined||v==='')return null;var d=null;if(typeof v==='number')d=new Date(v*1000);else{var s=String(v).trim();var m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1]));else{var n=Number(s);if(isFinite(n)&&s!=='')d=new Date(n*1000);else d=new Date(s)}}if(!d||isNaN(d.getTime()))return String(v);return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})}function loadMaj(tableName){if(!tableName){dateMajEl.textContent='Mise à jour BDD : no !byYear[x.year])byYear[x.year]=x});return byYear})}function updateYearChoice(year){var info=state.yearMap[String(year)];if(!info)return Promise.reject(new Error('Référence introuvable pour '+year));return updateRefChoice(state.names.choiceYear,'Annee',info.rowId)}function load(){if(started)return;started=true;setStatus('Connexion au document…');grist.docApi.listTables().then(function(list){var T={themes:findTable(list,'THEMES_CARTOGRAPHIE'),themesEmiz:findTable(list,'THEMES_CARTOGRAPHIE_EMIZ'),plans:findTable(list,'PLANS_CARTOGRAPHIE'),choiceYear:findTable(list,'CHOIX_ANNEE_CARTOGRAPHIE'),choiceTheme:findTable(list,'CHOIX_THEME_CARTOGRAPHIE'),choiceThemeEmiz:findTable(list,'CHOIX_THEME_CARTOGRAPHIE_EMIZ'),choicePlan:findTable(list,'CHOIX_PLAN_CARTOGRAPHIE'),parametres:findTable(list,'PARAMETRES')};['themes','themesEmiz','plans','choiceYear','choiceTheme','choiceThemeEmiz','choicePlan'].forEach(function(k){if(!T[k])throw new Error('Table introuvable : '+k)});state.names=T;return Promise.all([grist.docApi.fetchTable(T.themes),grist.docApi.fetchTable(T.themesEmiz),grist.docApi.fetchTable(T.plans),grist.docApi.fetchTable(T.choiceYear),grist.docApi.fetchTable(T.choiceTheme),grist.docApi.fetchTable(T.choiceThemeEmiz),grist.docApi.fetchTable(T.choicePlan),discoverYears(list),loadMaj(T.parametres)])}).then(function(all){state.themes=all[0];state.themesEmiz=all[1];state.plans=all[2];state.choiceYear=all[3];state.choiceTheme=all[4];state.choiceThemeEmiz=all[5];state.choicePlan=all[6];state.yearMap=all[7]||{};var years=Object.keys(state.yearMap).sort();fill(yearSel,years,function(y){return y},function(y){return y});var themes=rows(state.themes),themesEmiz=rows(state.themesEmiz),plans=rows(state.plans);plans.sort(function(a,b){return String(a.Libelle||'').localeCompare(String(b.Libelle||''),'fr')});fill(themeSel,themes,function(r){return r.id},function(r){return r.Libelle||r.Code||r.id});fill(themeEmizSel,themesEmiz,function(r){return r.id},function(r){return r.Libelle||r.Code||r.id});fill(planSel,plans,function(r){return r.id},function(r){return r.Libelle||r.Code||r.id});var cy=firstRow(state.choiceYear),ct=firstRow(state.choiceTheme),cte=firstRow(state.choiceThemeEmiz),cp=firstRow(state.choicePlan);if(cy){var cyid=refId(cy.Annee);Object.keys(state.yearMap).forEach(function(y){if(state.yearMap[y].rowId===cyid)yearSel.value=y})}if(ct){var tid=refId(ct.Theme);if(tid)themeSel.value=String(tid)}if(cte){var teid=refId(cte.Theme);if(teid)themeEmizSel.value=String(teid)}if(cp){var pid=refId(cp.Plan);if(pid)planSel.value=String(pid)}updatePlanVisibility();setStatus(years.length?'Prêt':'Années non détectées — aucune table avec valeurs 20xx',years.length?'ok':'err')}).catch(function(e){console.error(e);setStatus('Erreur : '+(e&&e.message?e.message:String(e)),'err')})}themeSel.addEventListener('change',function(){setStatus('Mise à jour…');updateRefChoice(state.names.choiceTheme,'Theme',themeSel.value).then(function(){updatePlanVisibility();setStatus('Mis à jour','ok')}).catch(function(e){setStatus('Erreur : '+e.message,'err')})});themeEmizSel.addEventListener('change',function(){setStatus('Mise à jour…');updateRefChoice(state.names.choiceThemeEmiz,'Theme',themeEmizSel.value).then(function(){setStatus('Mis à jour','ok')}).catch(function(e){setStatus('Erreur : '+e.message,'err')})});planSel.addEventListener('change',function(){setStatus('Mise à jour…');updateRefChoice(state.names.choicePlan,'Plan',planSel.value).then(function(){setStatus('Mis à jour','ok')}).catch(function(e){setStatus('Erreur : '+e.message,'err')})});yearSel.addEventListener('change',function(){setStatus('Mise à jour…');updateYearChoice(yearSel.value).then(function(){setStatus('Mis à jour','ok')}).catch(function(e){setStatus('Erreur : '+e.message,'err')})});try{grist.ready({requiredAccess:'full'});setTimeout(load,500)}catch(e){setStatus('Erreur API Grist : '+(e&&e.message?e.message:String(e)),'err')}})();</script></body></html>
