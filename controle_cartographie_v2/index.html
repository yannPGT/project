<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrôles cartographie SYNAPSE v2</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif;color:#1f2937;background:#f8fafc}body{padding:10px}.panel{height:100%;display:flex;align-items:center;gap:14px;padding:10px 12px;background:#fff;border:1px solid #e5e7eb;border-radius:10px}.control{display:flex;align-items:center;gap:8px}label{font-size:12px;font-weight:700;white-space:nowrap}select{height:36px;padding:0 30px 0 9px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-size:13px}#annee{min-width:95px}#theme{min-width:230px}#plan{min-width:280px}#planWrap{display:none}.status{margin-left:auto;font-size:11px;color:#6b7280}.ok{color:#166534}.err{color:#991b1b}@media(max-width:850px){.panel{flex-direction:column;align-items:stretch;justify-content:center}.control{justify-content:space-between}.control select{flex:1}.status{margin-left:0;text-align:right}}
</style>
</head>
<body>
<div class="panel">
  <div class="control"><label for="annee">Année</label><select id="annee"></select></div>
  <div class="control"><label for="theme">Thème cartographique</label><select id="theme"></select></div>
  <div class="control" id="planWrap"><label for="plan">Plan</label><select id="plan"></select></div>
  <div id="status" class="status">Script chargé…</div>
</div>
<script>
(function(){
'use strict';
var started=false,status=document.getElementById('status'),yearSel=document.getElementById('annee'),themeSel=document.getElementById('theme'),planSel=document.getElementById('plan'),planWrap=document.getElementById('planWrap'),state={yearMap:{}};
function setStatus(t,c){status.textContent=t;status.className='status'+(c?' '+c:'');}
function rows(t){var out=[],ids=t&&t.id;if(!ids||!ids.length)return out;for(var i=0;i<ids.length;i++){var r={id:ids[i]};Object.keys(t).forEach(function(k){if(k!=='id'&&Array.isArray(t[k]))r[k]=t[k][i];});out.push(r);}return out;}
function refId(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return v;if(Array.isArray(v)){for(var i=0;i<v.length;i++)if(typeof v[i]==='number')return v[i];}if(typeof v==='object'&&v.rowId!==undefined)return Number(v.rowId);var n=Number(v);return isFinite(n)?n:null;}
function label(v){if(v===null||v===undefined)return'';if(typeof v==='string'||typeof v==='number')return String(v);if(Array.isArray(v)){for(var i=v.length-1;i>=0;i--)if(typeof v[i]==='string'||typeof v[i]==='number')return String(v[i]);}if(typeof v==='object'){if(v.displayValue!==undefined)return String(v.displayValue);if(v.value!==undefined)return String(v.value);}return String(v);}
function fill(sel,items,getValue,getLabel){sel.innerHTML='';items.forEach(function(x){var o=document.createElement('option');o.value=String(getValue(x));o.textContent=String(getLabel(x));sel.appendChild(o);});}
function firstRow(t){var a=rows(t);return a.length?a[0]:null;}
function findTable(list,wanted){if(list.indexOf(wanted)>=0)return wanted;var w=wanted.toLowerCase();for(var i=0;i<list.length;i++)if(String(list[i]).toLowerCase()===w)return list[i];return null;}
function themeIsPlan(){var id=Number(themeSel.value),a=rows(state.themes),r=null;for(var i=0;i<a.length;i++)if(a[i].id===id){r=a[i];break;}if(!r)return false;var c=String(r.Code||'').toUpperCase(),l=String(r.Libelle||'').toLowerCase();return c==='PLAN'||l==='plans mis en œuvre'||l==='plans mis en oeuvre';}
function updatePlanVisibility(){planWrap.style.display=themeIsPlan()?'flex':'none';}
function fetch(name){setStatus('Chargement : '+name+'…');return grist.docApi.fetchTable(name);}
function updateRefChoice(tableName,col,value){return grist.docApi.fetchTable(tableName).then(function(t){var r=firstRow(t),n=Number(value),action;if(r){action=['UpdateRecord',tableName,r.id,{}];action[3][col]=n;}else{action=['AddRecord',tableName,null,{}];action[3][col]=n;}return grist.docApi.applyUserActions([action]);});}
function updateYearChoice(year){var ref=state.yearMap[String(year)];if(!ref)return Promise.reject(new Error('Référence introuvable pour '+year));return updateRefChoice(state.names.choiceYear,'Annee',ref);}
function load(expandedRecords){if(started)return;started=true;setStatus('Connexion au document…');grist.docApi.listTables().then(function(list){var T={stats:findTable(list,'STATISTIQUES_GENERALE'),themes:findTable(list,'THEMES_CARTOGRAPHIE'),plans:findTable(list,'PLANS_CARTOGRAPHIE'),choiceYear:findTable(list,'CHOIX_ANNEE_CARTOGRAPHIE'),choiceTheme:findTable(list,'CHOIX_THEME_CARTOGRAPHIE'),choicePlan:findTable(list,'CHOIX_PLAN_CARTOGRAPHIE')};Object.keys(T).forEach(function(k){if(!T[k])throw new Error('Table introuvable : '+k);});state.names=T;return Promise.all([fetch(T.stats),fetch(T.themes),fetch(T.plans),fetch(T.choiceYear),fetch(T.choiceTheme),fetch(T.choicePlan)]);}).then(function(all){state.stats=all[0];state.themes=all[1];state.plans=all[2];state.choiceYear=all[3];state.choiceTheme=all[4];state.choicePlan=all[5];var rawStats=rows(state.stats),expanded=Array.isArray(expandedRecords)?expandedRecords:[];state.yearMap={};var years=[];
for(var i=0;i<expanded.length;i++){var er=expanded[i],y=label(er.Annee).trim();if(/^20\d\d$/.test(y)){var raw=null;for(var j=0;j<rawStats.length;j++)if(rawStats[j].id===er.id){raw=rawStats[j];break;}var rid=raw?refId(raw.Annee):null;if(rid){state.yearMap[y]=rid;if(years.indexOf(y)<0)years.push(y);}}}
years.sort();fill(yearSel,years,function(y){return y;},function(y){return y;});
var themes=rows(state.themes),plans=rows(state.plans);plans.sort(function(a,b){return String(a.Libelle||'').localeCompare(String(b.Libelle||''),'fr');});fill(themeSel,themes,function(r){return r.id;},function(r){return r.Libelle||r.Code||r.id;});fill(planSel,plans,function(r){return r.id;},function(r){return r.Libelle||r.Code||r.id;});
var cy=firstRow(state.choiceYear),ct=firstRow(state.choiceTheme),cp=firstRow(state.choicePlan);if(cy){var cyid=refId(cy.Annee);Object.keys(state.yearMap).forEach(function(y){if(state.yearMap[y]===cyid)yearSel.value=y;});}if(ct){var tid=refId(ct.Theme);if(tid)themeSel.value=String(tid);}if(cp){var pid=refId(cp.Plan);if(pid)planSel.value=String(pid);}updatePlanVisibility();setStatus(years.length?'Prêt':'Années non détectées','ok');}).catch(function(e){console.error(e);setStatus('Erreur : '+(e&&e.message?e.message:String(e)),'err');});}
themeSel.addEventListener('change',function(){setStatus('Mise à jour…');updateRefChoice(state.names.choiceTheme,'Theme',themeSel.value).then(function(){updatePlanVisibility();setStatus('Mis à jour','ok');}).catch(function(e){setStatus('Erreur : '+e.message,'err');});});
planSel.addEventListener('change',function(){setStatus('Mise à jour…');updateRefChoice(state.names.choicePlan,'Plan',planSel.value).then(function(){setStatus('Mis à jour','ok');}).catch(function(e){setStatus('Erreur : '+e.message,'err');});});
yearSel.addEventListener('change',function(){setStatus('Mise à jour…');updateYearChoice(yearSel.value).then(function(){setStatus('Mis à jour','ok');}).catch(function(e){setStatus('Erreur : '+e.message,'err');});});
try{grist.ready({requiredAccess:'full'});grist.onRecords(function(records){load(records);},{expandRefs:true});setTimeout(function(){if(started)return;grist.docApi.fetchSelectedTable({format:'rows',expandRefs:true,keepEncoded:false}).then(load).catch(function(e){setStatus('Erreur année : '+e.message,'err');});},1000);}catch(e){setStatus('Erreur API Grist : '+(e&&e.message?e.message:String(e)),'err');}
})();
</script>
</body>
</html>
