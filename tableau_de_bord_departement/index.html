<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tableau de bord départemental</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f6f8fb;--card:#fff;--line:#e3e8ef;--text:#1f2937;--muted:#667085;--blue:#1d4ed8;--green:#15803d;--orange:#b45309;--red:#b91c1c}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
#app{padding:12px}.shell{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.06);overflow:hidden}
.head{padding:14px 16px 12px;border-bottom:1px solid var(--line)}.title{font-size:16px;font-weight:700}.subtitle{font-size:11px;color:var(--muted);margin-top:2px}
.selectors{display:grid;grid-template-columns:160px minmax(240px,1fr) auto;gap:10px;align-items:end;margin-top:12px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px;font-weight:700}.field select{width:100%;height:36px;border:1px solid #cfd6df;border-radius:7px;background:#fff;padding:0 10px;font-size:13px;color:var(--text)}.zone{font-size:12px;font-weight:700;color:#475467;padding:10px 2px;white-space:nowrap}
.main{display:grid;grid-template-columns:1.05fr .95fr;min-height:210px}.panel{padding:14px 16px}.panel+.panel{border-left:1px solid var(--line)}.panel-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#475467;font-weight:700;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fbfcfe}.klabel{font-size:10px;color:var(--muted)}.kvalue{font-size:23px;font-weight:700;margin-top:4px}.late .kvalue{color:var(--red)}
.objective{margin-top:14px}.objective-line{display:flex;justify-content:space-between;gap:10px;font-size:12px}.objective-line strong{font-size:13px}.track{height:8px;border-radius:999px;background:#e8edf3;overflow:hidden;margin:8px 0 6px}.bar{height:100%;background:var(--blue);width:0}.forecast{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}.status.good{color:var(--green);font-weight:700}.status.warn{color:var(--orange);font-weight:700}.status.bad{color:var(--red);font-weight:700}
#themes{font-size:12px}.theme-placeholder{color:var(--muted);padding:12px 0}.theme-html{max-height:170px;overflow:auto}.theme-html table{width:100%!important}.theme-html img{max-width:100%}
.alerts{border-top:1px solid var(--line);padding:10px 16px;font-size:11px;background:#fbfcfe}.alert-title{font-weight:700;margin-right:8px}.alert-ok{color:var(--green)}.alert-warn{color:var(--orange)}.alert-bad{color:var(--red)}
#error{display:none;margin:10px 12px;padding:9px;border:1px solid #fecaca;background:#fff;color:#991b1b;border-radius:7px;font-size:11px;white-space:pre-wrap}
@media(max-width:760px){.selectors{grid-template-columns:1fr 1fr}.zone{grid-column:1/-1;padding:0}.main{grid-template-columns:1fr}.panel+.panel{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body><div id="app"><div class="shell">
<div class="head"><div class="title">Tableau de bord départemental</div><div class="subtitle">Suivi annuel des exercices territoriaux de gestion de crise</div><div class="selectors"><div class="field"><label>Année</label><select id="year"></select></div><div class="field"><label>Département</label><select id="dept"></select></div><div class="zone" id="zone">—</div></div></div>
<div class="main"><section class="panel"><div class="panel-title">Activité & objectif</div><div class="kpis"><div class="kpi"><div class="klabel">Réalisés</div><div class="kvalue" id="real">—</div></div><div class="kpi"><div class="klabel">Programmés</div><div class="kvalue" id="prog">—</div></div><div class="kpi late"><div class="klabel">En retard</div><div class="kvalue" id="late">—</div></div></div><div class="objective"><div class="objective-line"><span>Objectif annuel</span><strong id="obj">—</strong></div><div class="track"><div class="bar" id="bar"></div></div><div class="forecast"><span id="rate">—</span><span id="forecast">—</span></div></div></section>
<section class="panel"><div class="panel-title" id="themeTitle">Objectifs thématiques</div><div id="themes"><div class="theme-placeholder">Chargement…</div></div></section></div>
<div class="alerts"><span class="alert-title">Points de vigilance</span><span id="alerts">—</span></div></div><div id="error"></div></div>
<script>
'use strict';
const T_IND='INDICATEURS_NIVEAUX_V2',T_ADMIN='NIVEAUX_ADMINISTRATIFS',T_OBJ='HTML_OBJECTIFS_DEPARTEMENT';
let ind=[],admins=[],objs=[],yearMap={};let currentYear='',currentDept='';
const $=id=>document.getElementById(id);function num(v){const n=Number(v);return Number.isFinite(n)?n:0}function rows(t){const a=[];if(!t||!Array.isArray(t.id))return a;for(let i=0;i<t.id.length;i++){const r={id:t.id[i]};for(const k in t)if(k!=='id'&&Array.isArray(t[k]))r[k]=t[k][i];a.push(r)}return a}function refId(v){if(typeof v==='number')return v;if(Array.isArray(v)){for(const x of v)if(typeof x==='number')return x}if(v&&typeof v==='object'&&v.rowId!=null)return Number(v.rowId);const n=Number(v);return Number.isFinite(n)?n:null}
function adminById(id){return admins.find(r=>r.id===id)||null}function adminLabel(v){if(typeof v==='string'&&!/^\d+$/.test(v))return v;const r=adminById(refId(v));return r?String(r.Niveau_administratif||''):String(v??'')}function typeLabel(r){const a=adminById(refId(r.Niveau_administratif));return String(r.Type_niveau||a?.Type_niveau||'')}function zoneLabel(r){const v=r.Zone;if(typeof v==='string'&&!/^\d+$/.test(v))return v;const a=adminById(refId(v));if(a)return String(a.Niveau_administratif||a.Zone||'');const dep=adminById(refId(r.Niveau_administratif));return String(dep?.Zone||'')}
function yearOf(r){const v=r.Annee;if(v&&typeof v==='object'&&v.Annee!=null)return String(v.Annee);const s=String(v??'');const m=s.match(/20\d{2}/);if(m)return m[0];const id=refId(v);return yearMap[id]||''}
async function buildYearMap(){try{const tables=await grist.docApi.listTables();for(const name of tables.filter(n=>/ann[eé]e/i.test(String(n)))){try{for(const r of rows(await grist.docApi.fetchTable(name))){for(const k in r){const s=String(r[k]??'').trim();if(/^20\d{2}$/.test(s)&&yearMap[r.id]===undefined)yearMap[r.id]=s}}}catch(e){}}}catch(e){}}
function isDept(r){const t=typeLabel(r).toLowerCase();if(t)return t.includes('département')||t.includes('departement');return /^\d{2,3}\s*-/.test(adminLabel(r.Niveau_administratif))}
function deptRows(){return ind.filter(isDept).filter(r=>yearOf(r))}function uniq(a){return [...new Set(a.filter(Boolean))]}
function fillSelectors(){const ys=uniq(deptRows().map(yearOf)).sort((a,b)=>b-a);if(!currentYear||!ys.includes(currentYear))currentYear=ys.includes('2026')?'2026':ys[0]||'';$('year').innerHTML=ys.map(y=>`<option value="${y}" ${y===currentYear?'selected':''}>${y}</option>`).join('');const ds=deptRows().filter(r=>yearOf(r)===currentYear).map(r=>adminLabel(r.Niveau_administratif)).sort((a,b)=>a.localeCompare(b,'fr',{numeric:true}));if(!currentDept||!ds.includes(currentDept))currentDept=ds[0]||'';$('dept').innerHTML=ds.map(d=>`<option ${d===currentDept?'selected':''}></option>`).join('');[...$('dept').options].forEach((o,i)=>{o.value=ds[i];o.textContent=ds[i]})}
function current(){return deptRows().find(r=>yearOf(r)===currentYear&&adminLabel(r.Niveau_administratif)===currentDept)||null}
function keyOf(r){return String(r?.Cle_Annee_Niveau??'').trim()}function renderThemes(r){$('themeTitle').textContent='Objectifs thématiques'+(currentYear?' '+currentYear:'');const key=keyOf(r);const o=objs.find(x=>String(x.Cle_Annee_Niveau??'').trim()===key);const box=$('themes');if(o&&o.HTML_Objectifs){box.innerHTML=`<div class="theme-html">${o.HTML_Objectifs}</div>`}else box.innerHTML='<div class="theme-placeholder">Aucun objectif thématique disponible pour cette sélection.</div>'}
function render(){const r=current();if(!r){$('zone').textContent='—';$('real').textContent=$('prog').textContent=$('late').textContent='—';$('obj').textContent=$('rate').textContent=$('forecast').textContent='—';$('bar').style.width='0';renderThemes(null);$('alerts').textContent='Aucune donnée';return}const real=num(r.Nb_Realise),prog=num(r.Nb_Programme),late=num(r.Nb_Programme_En_Retard),obj=num(r.Objectif),prev=('Nb_Prevu' in r)?num(r.Nb_Prevu):real+prog;const rate=obj>0?Math.round(real/obj*100):0;$('zone').textContent=zoneLabel(r)||'Zone non renseignée';$('real').textContent=real;$('prog').textContent=prog;$('late').textContent=late;$('obj').textContent=obj>0?`${real} / ${obj}`:'Sans objectif';$('rate').textContent=obj>0?`${rate} % réalisés`:'Pas d’objectif quantitatif';$('bar').style.width=Math.min(100,rate)+'%';const ok=obj>0&&prev>=obj;$('forecast').innerHTML=obj>0?`Prévision : <strong>${prev} / ${obj}</strong> <span class="status ${ok?'good':'bad'}">${ok?'✓ Objectif prévu':'⚠ Objectif non prévu'}</span>`:'';renderThemes(r);const alerts=[];if(late>0)alerts.push(`${late} exercice${late>1?'s':''} programmé${late>1?'s':''} en retard`);if(obj>0&&prev<obj)alerts.push('objectif annuel non atteint en prévision');$('alerts').className=alerts.length?'alert-bad':'alert-ok';$('alerts').textContent=alerts.length?alerts.join(' • '):'Aucun point de vigilance quantitatif'}
function showError(e){$('error').style.display='block';$('error').textContent='Erreur widget : '+(e?.message||e)}function hideError(){$('error').style.display='none'}
async function load(){try{await buildYearMap();[ind,admins,objs]=await Promise.all([grist.docApi.fetchTable(T_IND).then(rows),grist.docApi.fetchTable(T_ADMIN).then(rows),grist.docApi.fetchTable(T_OBJ).then(rows)]);fillSelectors();render();hideError()}catch(e){showError(e)}}
$('year').addEventListener('change',e=>{currentYear=e.target.value;currentDept='';fillSelectors();render()});$('dept').addEventListener('change',e=>{currentDept=e.target.value;render()});
grist.ready({requiredAccess:'full'});load();setInterval(load,3000);
</script></body></html>
