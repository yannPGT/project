<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Indicateurs nationaux SYNAPSE</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
:root{--bg:#f8fafc;--card:#fff;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--green:#2e7d32;--orange:#ed6c02;--red:#c62828;--blue:#2563eb;--slate:#475569}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}body{padding:12px}.wrap{display:grid;gap:10px}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:2px}.year{font-size:13px;color:var(--slate);font-weight:700;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;min-height:122px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.04)}.label{font-size:12px;color:var(--muted);line-height:1.25}.value{font-size:32px;font-weight:800;line-height:1;margin-top:10px;letter-spacing:-.5px}.hint{font-size:11px;color:var(--muted);margin-top:8px}.accent{height:4px;border-radius:99px;margin-top:12px;background:var(--slate)}.good .accent{background:var(--green)}.warn .accent{background:var(--orange)}.bad .accent{background:var(--red)}.info .accent{background:var(--blue)}.good .value{color:var(--green)}.warn .value{color:var(--orange)}.bad .value{color:var(--red)}.info .value{color:var(--blue)}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--border);border-radius:10px;padding:20px;text-align:center;color:var(--muted)}
.risks{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}.risk-head{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:10px}.risk-head strong{font-size:13px}.risk-head span{font-size:10px;color:var(--muted)}.risk-types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0}.risk-type{border-bottom:1px solid #eef2f6}.risk-type:nth-child(odd){border-right:1px solid #eef2f6}.risk-toggle{width:100%;border:0;background:#fff;padding:9px 12px;display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;text-align:left;cursor:pointer}.risk-toggle:hover{background:#f8fafc}.risk-name{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.risk-count{font-size:11px;font-weight:800;color:var(--blue);min-width:28px;text-align:right}.chev{font-size:10px;color:var(--muted)}.risk-detail{display:none;background:#fbfcfe;border-top:1px solid #f0f2f5;padding:3px 12px 7px}.risk-detail.open{display:block}.risk-row{display:grid;grid-template-columns:1fr 38px;gap:8px;padding:4px 0;font-size:10px;border-bottom:1px dotted #e5e7eb}.risk-row:last-child{border-bottom:0}.risk-row span:last-child{text-align:right;font-weight:700}.risk-loading{padding:14px;text-align:center;color:var(--muted);font-size:11px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.value{font-size:28px}.risk-types{grid-template-columns:1fr}.risk-type:nth-child(odd){border-right:0}}@media(max-width:520px){body{padding:8px}.grid{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}.card{min-height:108px}}
</style></head><body><div class="wrap"><div class="header"><div><div class="title">Synthèse nationale</div><div class="sub">Indicateurs départementaux consolidés</div></div><div id="year" class="year"></div></div><div id="grid" class="grid"><div class="empty">En attente des données Grist…</div></div><section class="risks"><div class="risk-head"><strong>Répartition nationale des exercices par risque</strong><span>Cliquer sur un type pour afficher le détail</span></div><div id="riskTypes" class="risk-types"><div class="risk-loading">Chargement des risques…</div></div></section></div>
<script>
"use strict";let activeYear='',source=[];const openTypes=new Set();
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}function pct(v){let n=num(v);if(n<=1)n*=100;return Math.round(n)}function fmt(v){return new Intl.NumberFormat('fr-FR').format(num(v))}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function yearOf(r){const a=r?.Annee;if(a&&typeof a==='object'&&a.rowId!==undefined)return String(a.rowId);if(a!==null&&a!==undefined)return String(a);return''}function selected(r){return !('Annee_selectionnee' in r)||r.Annee_selectionnee===true||r.Annee_selectionnee===1}function clsPct(p){if(p>=75)return'good';if(p>=50)return'warn';return'bad'}function clsDelay(n){return n>0?'bad':'good'}function card(label,value,hint,cls){return `<div class="card ${cls||''}"><div><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint||''}</div></div><div class="accent"></div></div>`}
function tableRows(t){if(!t||!Array.isArray(t.id))return[];return t.id.map((id,i)=>{let r={id};for(const k in t)if(k!=='id'&&Array.isArray(t[k]))r[k]=t[k][i];return r})}
function sourceYear(r){for(const k of ['Annee_REF','Annee','Année']){let v=r[k];if(v&&typeof v==='object'&&v.Annee!=null)v=v.Annee;const m=String(v??'').match(/20\d{2}/);if(m)return m[0]}return''}
function renderRisks(){const box=document.getElementById('riskTypes');if(!source.length){box.innerHTML='<div class="risk-loading">Aucune donnée de risque disponible.</div>';return}let rows=source.filter(r=>sourceYear(r)===activeYear);const groups={};for(const r of rows){const t=String(r.Type_de_risque??r['Type de risque']??'Non renseigné').trim()||'Non renseigné',risk=String(r.Risque??'Non renseigné').trim()||'Non renseigné';groups[t]??={total:0,risks:{}};groups[t].total++;groups[t].risks[risk]=(groups[t].risks[risk]||0)+1}const names=Object.keys(groups).sort((a,b)=>groups[b].total-groups[a].total||a.localeCompare(b,'fr'));if(!names.length){box.innerHTML='<div class="risk-loading">Aucun exercice pour cette année.</div>';return}box.innerHTML=names.map((n,i)=>{const g=groups[n],open=openTypes.has(n),detail=Object.entries(g.risks).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'fr')).map(([r,c])=>`<div class="risk-row"><span>${esc(r)}</span><span>${fmt(c)}</span></div>`).join('');return `<div class="risk-type"><button class="risk-toggle" data-risk-type="${esc(n)}"><span class="risk-name">${esc(n)}</span><span class="risk-count">${fmt(g.total)}</span><span class="chev">${open?'▴':'▾'}</span></button><div class="risk-detail ${open?'open':''}">${detail}</div></div>`}).join('');document.querySelectorAll('[data-risk-type]').forEach(b=>b.onclick=()=>{const n=b.dataset.riskType;openTypes.has(n)?openTypes.delete(n):openTypes.add(n);renderRisks()})}
async function loadSource(){try{source=tableRows(await grist.docApi.fetchTable('BDD_SYNAPSE_2026'));renderRisks()}catch(e){document.getElementById('riskTypes').innerHTML='<div class="risk-loading">Impossible de charger les données de risque.</div>'}}
function render(records){const rows=(Array.isArray(records)?records:[]).filter(selected),r=rows[0],grid=document.getElementById('grid'),year=document.getElementById('year');if(!r){grid.innerHTML='<div class="empty">Aucune donnée pour l’année sélectionnée.</div>';year.textContent='';return}activeYear=yearOf(r);year.textContent=activeYear?`Année ${activeYear}`:'';const real=num(r.Nb_Exercices_Realises),prog=num(r.Nb_Exercices_Programmes),prev=pct(r.Pct_Departements_Prevision_Atteinte),retard=num(r.Nb_Exercices_En_Retard),nat=pct(r.Pct_Couverture_NAT),pop=pct(r.Pct_Couverture_POP),cyb=pct(r.Pct_Couverture_CYB),rup=pct(r.Pct_Couverture_RUP);grid.innerHTML=card('Exercices réalisés',fmt(real),'Total des exercices réalisés','info')+card('Exercices programmés',fmt(prog),'Exercices encore programmés','info')+card('Atteinte prévisionnelle',prev+' %','Départements atteignant l’objectif en prévision',clsPct(prev))+card('Exercices en retard',fmt(retard),retard===0?'Aucun exercice programmé en retard':'Exercices programmés dont la date est dépassée',clsDelay(retard))+card('Couverture NAT',nat+' %','Objectif risque naturel réalisé',clsPct(nat))+card('Couverture POP',pop+' %','Objectif population / élus réalisé',clsPct(pop))+card('Couverture CYBER',cyb+' %','Objectif cyber réalisé',clsPct(cyb))+card('Couverture RUP',rup+' %','Objectif rupture capacitaire réalisé',clsPct(rup));renderRisks()}
grist.ready({requiredAccess:'full'});grist.onRecords(render);loadSource();
</script></body></html>
