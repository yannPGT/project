<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Indicateurs nationaux SYNAPSE</title><script src="https://docs.getgrist.com/grist-plugin-api.js"></script><style>:root{--bg:#f8fafc;--border:#e5e7eb;--text:#111827;--muted:#6b7280;--green:#2e7d32;--orange:#ed6c02;--red:#c62828;--blue:#2563eb;--slate:#475569}*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}body{padding:12px}.wrap{display:grid;gap:10px}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:2px}.year{font-size:13px;color:var(--slate);font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px;min-height:122px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 1px 2px rgba(0,0,0,.04)}.label{font-size:12px;color:var(--muted)}.value{font-size:32px;font-weight:800;line-height:1;margin-top:10px}.hint{font-size:11px;color:var(--muted);margin-top:8px}.accent{height:4px;border-radius:99px;margin-top:12px;background:var(--slate)}.good .accent{background:var(--green)}.warn .accent{background:var(--orange)}.bad .accent{background:var(--red)}.info .accent{background:var(--blue)}.good .value{color:var(--green)}.warn .value{color:var(--orange)}.bad .value{color:var(--red)}.info .value{color:var(--blue)}.empty{grid-column:1/-1;background:#fff;border:1px dashed var(--border);border-radius:10px;padding:20px;text-align:center;color:var(--muted)}.risks{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}.risk-head{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}.risk-head strong{font-size:13px}.risk-head span{font-size:10px;color:var(--muted)}.risk-types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.risk-type{border-bottom:1px solid #eef2f6}.risk-type:nth-child(odd){border-right:1px solid #eef2f6}.risk-toggle{width:100%;border:0;background:#fff;padding:9px 12px;display:grid;grid-template-columns:1fr repeat(4,48px) 18px;gap:4px;align-items:center;text-align:left;cursor:pointer}.risk-toggle:hover{background:#f8fafc}.risk-name{font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.n{text-align:center;font-size:10px;font-weight:700}.total{color:var(--blue)}.real{color:var(--green)}.prog{color:var(--orange)}.cancel{color:var(--red)}.chev{font-size:10px;color:var(--muted);text-align:right}.risk-detail{display:none;background:#fbfcfe;border-top:1px solid #f0f2f5;padding:3px 12px 7px}.risk-detail.open{display:block}.risk-cols,.risk-row{display:grid;grid-template-columns:1fr repeat(4,48px);gap:4px;align-items:center}.risk-cols{padding:5px 0;font-size:8px;text-transform:uppercase;color:var(--muted);font-weight:700}.risk-row{padding:4px 0;font-size:10px;border-top:1px dotted #e5e7eb}.risk-loading{padding:14px;text-align:center;color:var(--muted);font-size:11px}.diag{grid-column:1/-1;padding:8px 12px;background:#fff7ed;color:#9a3412;font-size:10px;border-top:1px solid #fed7aa}@media(max-width:900px){.grid,.risk-types{grid-template-columns:repeat(2,minmax(0,1fr))}.risk-type:nth-child(odd){border-right:0}}@media(max-width:650px){.grid,.risk-types{grid-template-columns:1fr}.risk-toggle{grid-template-columns:1fr 40px 40px 45px 40px 16px}}</style></head><body><div class="wrap"><div class="header"><div><div class="title">Synthèse nationale</div><div class="sub">Indicateurs départementaux consolidés</div></div><div id="year" class="year"></div></div><div id="grid" class="grid"><div class="empty">En attente des données Grist…</div></div><section class="risks"><div class="risk-head"><strong>Répartition nationale des exercices par risque</strong><span>Total · Réalisé · Programmé · Annulé — cliquer pour le détail</span></div><div id="riskTypes" class="risk-types"><div class="risk-loading">Chargement des risques…</div></div></section></div><script>'use strict';let activeYear='',riskData=[],yearMap={};const openTypes=new Set();const num=v=>Number.isFinite(Number(v))?Number(v):0,fmt=v=>new Intl.NumberFormat('fr-FR').format(num(v)),pct=v=>{let n=num(v);if(n<=1)n*=100;return Math.round(n)},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#039;'}[c]));function tableRows(t){if(!t||!Array.isArray(t.id))return[];return t.id.map((id,i)=>{let r={id};for(const k in t)if(k!=='id'&&Array.isArray(t[k]))r[k]=t[k][i];return r})}function refId(v){if(typeof v==='number')return v;if(Array.isArray(v))return v.find(x=>typeof x==='number');if(v&&typeof v==='object'&&v.rowId!=null)return +v.rowId;let n=+v;return Number.isFinite(n)?n:null}function selected(r){return !('Annee_selectionnee'in r)||r.Annee_selectionnee===true||r.Annee_selectionnee===1}function extractYear(v){let m=String(v??'').match(/20\d{2}/);return m?m[0]:''}function yearOfIndicator(r){return extractYear(r?.Cle_Annee_Niveau)||extractYear(r?.Annee)||yearMap[refId(r?.Annee)]||''}function riskYear(r){return extractYear(r?.Cle_Annee_Niveau)||extractYear(r?.Annee)||yearMap[refId(r?.Annee)]||''}async function buildYearMap(){yearMap={};try{let names=(await grist.docApi.listTables()).filter(n=>/ann[eé]e/i.test(String(n)));for(const name of names){try{for(const r of tableRows(await grist.docApi.fetchTable(name))){for(const k in r){let s=String(r[k]??'').trim();if(/^20\d{2}(\.0)?$/.test(s)&&yearMap[r.id]===undefined)yearMap[r.id]=String(parseInt(s))}}}catch(e){}}}catch(e){}}function clsPct(p){return p>=75?'good':p>=50?'warn':'bad'}function card(l,v,h,c){return `<div class="card ${c||''}"><div><div class="label">${l}</div><div class="value">${v}</div><div class="hint">${h||''}</div></div><div class="accent"></div></div>`}function statOf(r){let total=num(r.Nb_exercices),real=num(r.Nb_Realise),cancel=num(r.Nb_Annule);return{total,real,cancel,prog:Math.max(0,total-real-cancel)}}function add(a,b){a.total+=b.total;a.real+=b.real;a.prog+=b.prog;a.cancel+=b.cancel}function renderRisks(){const box=document.getElementById('riskTypes');let rows=riskData.filter(r=>riskYear(r)===activeYear);if(!rows.length){let samples=riskData.slice(0,5).map(r=>`id ${r.id}: Annee=${esc(JSON.stringify(r.Annee))}, clé=${esc(r.Cle_Annee_Niveau||'—')}, année résolue=${esc(riskYear(r)||'—')}`).join('<br>');box.innerHTML=`<div class="risk-loading">Aucune donnée de risque disponible pour ${esc(activeYear)}.</div><div class="diag"><strong>Diagnostic :</strong> ${riskData.length} lignes chargées depuis STATISTIQUES_RISQUES · ${Object.keys(yearMap).length} références d'année résolues.${samples?'<br>'+samples:''}</div>`;return}const groups={};for(const r of rows){let t=String(r.Type_de_risque||'Non renseigné'),rk=String(r.Risque||'Non renseigné'),s=statOf(r);groups[t]??={s:{total:0,real:0,prog:0,cancel:0},risks:{}};add(groups[t].s,s);groups[t].risks[rk]??={total:0,real:0,prog:0,cancel:0};add(groups[t].risks[rk],s)}let names=Object.keys(groups).sort((a,b)=>groups[b].s.total-groups[a].s.total||a.localeCompare(b,'fr'));box.innerHTML=names.map(n=>{let g=groups[n],s=g.s,open=openTypes.has(n),details=Object.entries(g.risks).sort((a,b)=>b[1].total-a[1].total||a[0].localeCompare(b[0],'fr')).map(([rk,x])=>`<div class="risk-row"><span>${esc(rk)}</span><span class="n total">${fmt(x.total)}</span><span class="n real">${fmt(x.real)}</span><span class="n prog">${fmt(x.prog)}</span><span class="n cancel">${fmt(x.cancel)}</span></div>`).join('');return `<div class="risk-type"><button class="risk-toggle" data-t="${esc(n)}"><span class="risk-name">${esc(n)}</span><span class="n total">${fmt(s.total)}</span><span class="n real">${fmt(s.real)}</span><span class="n prog">${fmt(s.prog)}</span><span class="n cancel">${fmt(s.cancel)}</span><span class="chev">${open?'▴':'▾'}</span></button><div class="risk-detail ${open?'open':''}"><div class="risk-cols"><span>Risque</span><span>Total</span><span>Réalisé</span><span>Programmé</span><span>Annulé</span></div>${details}</div></div>`}).join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{let n=b.dataset.t;openTypes.has(n)?openTypes.delete(n):openTypes.add(n);renderRisks()})}async function loadRisks(){try{await buildYearMap();riskData=tableRows(await grist.docApi.fetchTable('STATISTIQUES_RISQUES'));renderRisks()}catch(e){document.getElementById('riskTypes').innerHTML=`<div class="risk-loading">Impossible de charger STATISTIQUES_RISQUES.</div><div class="diag">${esc(e.message||e)}</div>`}}function render(records){let rows=(Array.isArray(records)?records:[]).filter(selected),r=rows[0],grid=document.getElementById('grid'),year=document.getElementById('year');if(!r){grid.innerHTML='<div class="empty">Aucune donnée pour l’année sélectionnée.</div>';year.textContent='';return}activeYear=yearOfIndicator(r)||'2026';year.textContent=`Année ${activeYear}`;let real=num(r.Nb_Exercices_Realises),prog=num(r.Nb_Exercices_Programmes),prev=pct(r.Pct_Departements_Prevision_Atteinte),ret=num(r.Nb_Exercices_En_Retard),nat=pct(r.Pct_Couverture_NAT),pop=pct(r.Pct_Couverture_POP),cyb=pct(r.Pct_Couverture_CYB),rup=pct(r.Pct_Couverture_RUP);grid.innerHTML=card('Exercices réalisés',fmt(real),'Total des exercices réalisés','info')+card('Exercices programmés',fmt(prog),'Exercices encore programmés','info')+card('Atteinte prévisionnelle',prev+' %','Départements atteignant l’objectif en prévision',clsPct(prev))+card('Exercices en retard',fmt(ret),ret===0?'Aucun exercice programmé en retard':'Exercices programmés dont la date est dépassée',ret>0?'bad':'good')+card('Couverture NAT',nat+' %','Objectif risque naturel réalisé',clsPct(nat))+card('Couverture POP',pop+' %','Objectif population / élus réalisé',clsPct(pop))+card('Couverture CYBER',cyb+' %','Objectif cyber réalisé',clsPct(cyb))+card('Couverture RUP',rup+' %','Objectif rupture capacitaire réalisé',clsPct(rup));renderRisks()}grist.ready({requiredAccess:'full'});grist.onRecords(render);loadRisks();</script></body></html>
